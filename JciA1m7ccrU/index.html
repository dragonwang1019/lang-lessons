<!doctype html>
<html lang="zh-Hant" data-theme="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的語言課">

<title>各世代別に活躍してたアイドルたち！(G)I-DLEは第4世代？それとも第3世代？【K-POP】</title>
<script>try{var t=localStorage.getItem('lk.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#FFF8F4; --bg-soft:#FFFDFB; --card:#FFFFFF; --line:#F5E1E8;
  --fg:#432F37; --dim:#957D86;
  --rose:#EF6A8B; --rose-d:#D94F72; --lav:#9B6BD6; --peach:#FF9466;
  --mint:#43BE9B; --mint-d:#1F7A5F; --bad:#D9737A;
  --shadow:0 3px 14px rgba(214,124,147,.10);
  --shadow-lg:0 6px 22px rgba(190,120,140,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);line-height:1.7;
  font-family:"Hiragino Maru Gothic ProN","Yuanti TC","PingFang TC",-apple-system,
    BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(82px + env(safe-area-inset-bottom));overflow-x:hidden}

/* 標題列：暖色漸層，柔和陰影 */
header{position:sticky;top:0;z-index:20;
  background:linear-gradient(160deg,#FFE6EE 0%,#FFF1E2 100%);
  padding:11px 15px 10px;border-radius:0 0 20px 20px;
  box-shadow:0 3px 16px rgba(214,140,160,.14)}
h1{font-size:15.5px;margin:0 0 5px;font-weight:700;letter-spacing:.01em;color:#5A3242;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:11.5px;color:#9C6E7E;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.8);border:1px solid #F9DBE5;border-radius:999px;
  padding:1.5px 9px;font-size:11px;color:#8A5A6B}

#stage{position:relative;background:#FBF3F5}
#stage iframe,#stage video{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}

/* 底部導覽：浮起來的白色藥丸 */
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:30;display:flex;gap:5px;padding:6px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-lg)}
/* color 不要放進 transition：過渡中途會出現「白字白底」的隱形按鈕 */
nav button{flex:1;min-height:44px;font:inherit;font-size:13.5px;font-weight:600;
  color:#A98D98;background:transparent;border:none;border-radius:999px;
  transition:background .18s,box-shadow .18s}
nav button.on{color:#fff;background:linear-gradient(135deg,#FF8FA8,#EF6A8B);
  box-shadow:0 3px 10px rgba(239,106,139,.34)}

.bar{display:flex;gap:7px;padding:10px 14px;flex-wrap:wrap;background:var(--bg-soft);
  border-bottom:1px solid var(--line)}
button{font:inherit;font-size:12.5px;color:#6E4B58;background:#fff;
  border:1px solid #F3D9E3;border-radius:999px;padding:8px 13px;min-height:36px;
  cursor:pointer;box-shadow:0 1px 4px rgba(214,124,147,.07);
  transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.97)}
button.on{background:linear-gradient(135deg,#FFA9BE,#FFC49B);color:#fff;border-color:transparent;
  font-weight:700;box-shadow:0 3px 10px rgba(239,106,139,.26)}
button.wide{width:100%;min-height:46px;font-size:14px}
section{display:none}
section.show{display:block}

/* 逐句 */
#viewT{padding:16px 14px 28vh;line-break:strict;word-break:normal;overflow-wrap:break-word;max-width:100%}
.seg{margin:0 0 10px;padding:11px 13px;border-radius:16px;border:1px solid transparent;
  transition:background .18s,border-color .18s,box-shadow .18s;
  font-size:17px;line-height:2.3}
.seg.active{background:#FFF1F6;border-color:#FBD9E4;box-shadow:0 2px 12px rgba(239,106,139,.09)}
.seg .time{font-size:10.5px;color:#C7A6B1;font-variant-numeric:tabular-nums;
  cursor:pointer;user-select:none}
.seg .time:hover{color:var(--rose)}
/* 必須是 inline：日文沒有空白，inline-block 的詞串會變成不可斷行的原子區塊 → 整句溢出畫面 */
.tok{display:inline;padding:1px 0;border-radius:6px;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.tok:hover{background:#FFE9F1}
.tok.hot{background:#FFC8D9;color:#7A2340}
ruby{ruby-position:over}
rt{font-size:.5em;color:var(--lav);letter-spacing:.02em;font-weight:600;line-height:1.1}
.tok.hot rt{color:#7A2340}
.tok.course{background:rgba(255,148,102,.15);box-shadow:inset 0 -2px 0 var(--peach)}
.tok.saved{box-shadow:inset 0 -2px 0 var(--mint)}
body.nofuri rt{display:none}
body.nofuri .seg{line-height:1.85}

/* 詞卡 */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-radius:26px 26px 0 0;padding:16px 18px 22px;
  transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 -12px 40px rgba(190,120,140,.24);max-height:74vh;overflow:auto}
#sheet.open{transform:translateY(0)}
#sheet .w{font-size:26px;font-weight:700;color:#4A2F38;letter-spacing:.01em}
#sheet .rd{color:var(--lav);font-size:14.5px;margin-top:2px;font-weight:600}
#sheet .gl{color:var(--fg);font-size:15px;margin-top:7px}
#sheet .ctx{color:var(--dim);font-size:12.5px;margin:10px 0 14px;
  border-left:3px solid #FBD9E4;padding-left:10px;line-height:1.9}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* 測驗 */
#viewQ{padding:16px 14px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:18px 16px;box-shadow:var(--shadow)}
.qtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
  margin-bottom:13px}
.qtype{color:var(--rose);font-weight:700;letter-spacing:.08em}
.qstem{font-size:19.5px;line-height:2;margin-bottom:16px;word-break:break-word;color:#4A2F38}
.qstem .blank{color:var(--rose-d);font-weight:700;letter-spacing:.05em}
.qstem small{display:block;color:var(--dim);font-size:12.5px;margin-top:9px;line-height:1.6}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;font-size:15.5px;
  padding:13px 15px;min-height:48px;border-radius:15px;background:#FFF9FB;
  border:1px solid #F6DDE5;color:#4A2F38;box-shadow:none}
.opt:hover{background:#FFF0F6}
.opt.correct{background:#E9FBF4;border-color:#7DDBBE;color:var(--mint-d);font-weight:600}
.opt.wrong{background:#FFF0EE;border-color:#F7A99C;color:#C0392B}
.feed{margin-top:13px;font-size:13.5px;min-height:22px;line-height:1.9}
.feed.ok{color:var(--mint-d)}.feed.ng{color:#C0392B}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:30px 10px;line-height:2}

/* 生詞本 */
#viewW{padding:16px 14px}
.wstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.wstat div{background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:11px 4px;text-align:center;min-width:0;box-shadow:0 2px 8px rgba(214,124,147,.06)}
.wstat b{display:block;font-size:20px;line-height:1.25;color:#4A2F38}
.wstat span{font-size:10.5px;color:var(--dim)}
.vitem{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 13px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;
  background:#fff;box-shadow:0 2px 8px rgba(214,124,147,.06)}
.vitem .vt{font-size:16.5px;color:#4A2F38}
.vitem .vt small{color:var(--lav);font-size:11.5px;margin-left:6px;font-weight:600}
.vitem .vg{color:var(--dim);font-size:11.5px;display:block;margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;
  vertical-align:middle}
.d0{background:#E4CFD7}.d1{background:#C9A6F0}.d2{background:#7DDBBE}.d3{background:#FF8FA8}
.vitem .del{color:var(--bad);font-size:12px;padding:7px 9px;cursor:pointer;
  background:transparent;border:none;box-shadow:none}
a{color:var(--rose-d);font-weight:600}
.tip{font-size:11.5px;color:var(--dim);padding:0 14px 10px;line-height:1.9}
/* 影片嵌不進去時的溫柔提示卡 */
.fb{margin:12px;padding:16px 15px;border-radius:18px;background:#FFF2F6;
  border:1px dashed #F7C9D8;color:#8A5A6B;font-size:13px;line-height:2;text-align:center}
.fb b{display:block;color:#5A3242;font-size:14px;margin-bottom:4px}
.fb a{display:inline-block;margin:6px 0 2px}

/* ── 導讀 ───────────────────────────────────────────── */
#viewG{padding:16px 14px 20vh}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:18px 16px 20px;box-shadow:var(--shadow)}
.gtop{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);
  letter-spacing:.06em;margin-bottom:12px}
.gzh{font-size:15px;line-height:1.75;color:var(--dim);margin:8px 0 2px;letter-spacing:.2px}
.gzh:empty{display:none}
body.nozh .gzh{display:none}
.segzh{display:block;font-size:12.5px;line-height:1.6;color:var(--dim);margin-top:1px;opacity:.9}
body.nozh .segzh{display:none}
html[data-theme="cool"] .gzh,html[data-theme="cool"] .segzh{color:#93A6C4}
.gtext{font-size:21px;line-height:2.35;min-height:4.6em;color:#3A2630;margin-bottom:14px}
.gwords{display:flex;flex-wrap:wrap;gap:7px;min-height:34px;margin-bottom:14px}
.gw{background:rgba(255,148,102,.14);border:1px solid #FFD9C6;border-radius:999px;
  padding:5px 11px;font-size:12.5px;color:#B3521F;line-height:1.5}
.gw b{font-weight:700;font-size:13.5px}
.gw small{color:var(--lav);margin-left:5px}
.gw i{font-style:normal;opacity:.8;margin-left:6px}
.gbar{height:6px;background:#F7E4EA;border-radius:99px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#FFB3C4,var(--rose));transition:width .25s}
.gtip{font-size:11.5px;color:var(--dim);line-height:1.9;margin:14px 0 0}

/* ── 酷炫主題（深色 HUD）────────────────────────────── */
html[data-theme="cool"]{
  --bg:#0B0E14;--bg-soft:#0F141C;--card:#111823;--line:#233043;
  --fg:#E6F1FF;--dim:#7E8FA6;
  --rose:#00E5A0;--rose-d:#00C48C;--lav:#6EE7FF;--peach:#FFB020;
  --mint:#00E5A0;--mint-d:#00E5A0;--bad:#FF5C7A;
  --shadow:0 0 0 1px #1E2A3A,0 8px 24px rgba(0,0,0,.55);
  --shadow-lg:0 0 0 1px #263648,0 14px 44px rgba(0,0,0,.7);
}
html[data-theme="cool"] body{background:#0B0E14;
  background-image:linear-gradient(rgba(0,229,160,.045) 1px,transparent 1px),

  border-bottom:1px solid #233043;box-shadow:none}

html[data-theme="cool"] .tok.hot rt{color:#04120C}
html[data-theme="cool"] .tok.course{background:rgba(255,176,32,.13);

html[data-theme="cool"] .gcard,html[data-theme="cool"] .qcard{border-radius:6px;
  background:#0F1721;border:1px solid #233043}
html[data-theme="cool"] .gtext{color:#E6F1FF;font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:19px;line-height:2.1}
html[data-theme="cool"] .gbar{background:#16212E}
html[data-theme="cool"] .gbar i{background:linear-gradient(90deg,#00E5A0,#22D3EE)}
html[data-theme="cool"] .gw{background:rgba(255,176,32,.12);border-color:#4A3A18;
  border-radius:3px;color:#FFC55A}
html[data-theme="cool"] .gw small{color:#6EE7FF}
html[data-theme="cool"] .qtype{color:#00E5A0}
html[data-theme="cool"] .qstem{color:#E6F1FF}
html[data-theme="cool"] .opt{border-radius:4px;background:#0C141D;border:1px solid #233043;
  color:#CFE0F0}
html[data-theme="cool"] .opt:hover{background:#12202C}
html[data-theme="cool"] .opt.correct{background:rgba(0,229,160,.14);border-color:#00E5A0;
  color:#00E5A0}
html[data-theme="cool"] .opt.wrong{background:rgba(255,92,122,.13);border-color:#FF5C7A;
  color:#FF8FA3}
html[data-theme="cool"] .wstat div,html[data-theme="cool"] .vitem{border-radius:4px;
  background:#0F1721;border:1px solid #1E2A3A;box-shadow:none}
html[data-theme="cool"] .wstat b,html[data-theme="cool"] .vitem .vt{color:#E6F1FF;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}
html[data-theme="cool"] .vitem .vt small{color:#6EE7FF}
html[data-theme="cool"] .d0{background:#3C4C60}html[data-theme="cool"] .d1{background:#FFB020}
html[data-theme="cool"] .d2{background:#00E5A0}html[data-theme="cool"] .d3{background:#22D3EE}
html[data-theme="cool"] #sheet{background:#0F1721;border-top:1px solid #233043;border-radius:6px 6px 0 0}
html[data-theme="cool"] #sheet .w{color:#E6F1FF;font-family:ui-monospace,Menlo,monospace}
html[data-theme="cool"] #sheet .gl{color:#CFE0F0}
html[data-theme="cool"] #sheet .ctx{border-left-color:#233043;color:#7E8FA6}
html[data-theme="cool"] .fb{background:#141C12;border-color:#2F4A2A;color:#9FD08A}
html[data-theme="cool"] .fb b{color:#C7E9B4}
html[data-theme="cool"] .tip,html[data-theme="cool"] .gtip,html[data-theme="cool"] .empty{color:#7E8FA6}


/* ── 易用性：頁標題、設定面板、篩選 chips、搜尋、跳句 ───────── */
.crumb{display:inline-block;margin-bottom:6px;font-size:13px;color:var(--dim);text-decoration:none}
.crumb:hover{color:var(--rose-d)}
.ph{font-size:15px;margin:2px 0 10px;color:var(--fg);font-weight:800;letter-spacing:.3px}
.ph small{font-weight:500;font-size:12px;color:var(--dim);margin-left:6px}
.ph .langtag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;
  background:var(--rose);color:#fff;font-size:11px;font-weight:700;vertical-align:2px}
.cfg{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;padding:12px 12px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:16px}
.cfgrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cfgl{font-size:12px;color:var(--dim);min-width:32px;font-weight:700}
.chips{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 3px 10px rgba(239,106,139,.3)}
.chip:active{transform:scale(.96)}
.chip b{font-weight:800}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font-size:14px;font-family:inherit;margin:0 0 10px}
.jumpwrap{display:flex;align-items:center;gap:8px;margin-top:12px}
.jump{flex:1;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);font-size:13px;font-family:inherit;max-width:100%}
html[data-theme="cool"] .cfg{border-radius:6px;background:#0F151F;border-color:#22303F}
html[data-theme="cool"] .chip{border-radius:4px;background:#0B1119;color:#CFE0F0;border-color:#22303F}
html[data-theme="cool"] .chip.on{background:#00E5A0;border-color:#00E5A0;color:#04140E;box-shadow:0 0 14px rgba(0,229,160,.35)}
html[data-theme="cool"] .search,html[data-theme="cool"] .jump{border-radius:4px;background:#0B1119;color:#E6F1FF;border-color:#22303F}
html[data-theme="cool"] .ph{color:#E6F1FF}
html[data-theme="cool"] .ph .langtag{background:#00E5A0;color:#04140E;border-radius:3px}

/* ── 動態層（來自 motionsites.ai 的動態網站美學）─────────
   原則：動效只做在容器與轉場上，閱讀中的文字不動；
   一律用 Web Animations API 進場，不用 opacity:0 起始，避免 JS 掛掉時內容隱形。 */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
  display:none;opacity:.55}
#aurora{position:fixed;inset:-10% -10% auto -10%;height:340px;z-index:0;
  pointer-events:none;display:none;filter:blur(46px);opacity:.55}
#aurora i{position:absolute;display:block;width:220px;height:220px;border-radius:50%}
#aurora i:nth-child(1){left:6%;top:6%;background:#00E5A0;animation:drift 17s ease-in-out infinite}
#aurora i:nth-child(2){left:52%;top:-8%;background:#22D3EE;animation:drift 21s ease-in-out infinite reverse}
#aurora i:nth-child(3){right:4%;top:22%;background:#7C5CFF;animation:drift 25s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(34px,22px,0) scale(1.14)}
  66%{transform:translate3d(-22px,10px,0) scale(.92)}}
html[data-theme="cool"] #fx,html[data-theme="cool"] #aurora{display:block}
/* 只讓內容層浮在粒子之上；nav 必須保持 fixed（寫進來會把導覽列改成相對定位而滾走） */
html[data-theme="cool"] header,html[data-theme="cool"] #stage,
html[data-theme="cool"] section,html[data-theme="cool"] .bar{position:relative;z-index:1}
html[data-theme="cool"] nav{z-index:30}
html[data-theme="cool"] header{background:rgba(15,20,28,.86);backdrop-filter:blur(14px)}
/* 酷炫版的控制項回饋 */
html[data-theme="cool"] button:hover{color:#00E5A0;border-color:#00E5A0;
  box-shadow:0 0 0 1px rgba(0,229,160,.35),0 0 16px rgba(0,229,160,.22)}
html[data-theme="cool"] nav button.on{animation:pulseGlow 3.2s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 16px rgba(0,229,160,.45)}
  50%{box-shadow:0 0 26px rgba(34,211,238,.6)}}

<section id="viewT"></section>

<section id="viewQ">

</section>

</section>

<nav>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SEGS = D.segments, VID = D.vid;
// 生詞本與統計「按語言分開存」：日文、法文絕不混在同一個抽屜
const LANG = D.lang || 'ja';
const LANGNAME = {ja:'日本語', fr:'Français', en:'English'}[LANG] || LANG;
const WB_KEY = 'lk.wb.v2.' + LANG;
const ST_KEY = 'lk.stv.v2.' + LANG;
const MEM = {};

/* 一次性搬遷：舊版把所有語言塞進同一個 lk.wordbook.v1，靠文字腳本分流 */
(function migrateV1(){
  try{
    if(typeof localStorage === 'undefined') return;
    const raw = localStorage.getItem('lk.wordbook.v1');
    if(raw){
      const old = JSON.parse(raw) || {};
      const ja = {}, fr = {};
      for(const w of Object.keys(old)){
        const isJa = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff]/.test(w);
        (isJa ? ja : fr)[w] = old[w];
      }
      // 合併、不是「新 key 不存在才寫」：她可能先用過新版（新 key 只有一兩個詞），
      // 舊抽屜裡還有其他詞 —— 用存在就跳過會直接丟資料
      const mergeInto = (key, obj)=>{
        if(!Object.keys(obj).length) return;
        let cur = null;
        try{ cur = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
        const out = Object.assign({}, obj, cur || {});   // 兩邊都有時以新資料為準
        localStorage.setItem(key, JSON.stringify(out));
      };
      mergeInto('lk.wb.v2.ja', ja);
      mergeInto('lk.wb.v2.fr', fr);
      localStorage.removeItem('lk.wordbook.v1');
    }
    const oldSt = localStorage.getItem('lk.stats.v1');
    if(oldSt && !localStorage.getItem('lk.stv.v2.' + LANG)){
      localStorage.setItem('lk.stv.v2.' + LANG, oldSt);
      localStorage.removeItem('lk.stats.v1');
    }
  }catch(e){}
})();

/* @@SHARE-BEGIN */
/* ---------- 儲存（跨課共用；無痕/沙箱退回記憶體） ----------
   ⚠ 這一段由 make_deck.py 原樣複製到每日練習頁：排程規則只能有一份，改這裡就好 */
function readLS(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return MEM[k] || def; } }
function writeLS(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let WB = readLS(WB_KEY, {});
let ST = readLS(ST_KEY, {days:{}, streak:0, last:''});

// 一律用「本地日」字串，不要用 toISOString()：UTC+8/9 會把日期算成前一天
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
                       '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => isoLocal(new Date());
function addDays(iso, n){
  const [y,m,dd] = iso.split('-').map(Number);
  const d = new Date(y, m-1, dd); d.setDate(d.getDate() + n);
  return isoLocal(d);
}

/* ---------- 間隔重複（SM-2 簡化版） ---------- */
// x＝出現的句子（跨課複習時拿來出克漏字）；last＝最後一次作答日（算「今天練了幾個詞」）
function newRec(t){
  return {s:t.s, r:t.r||'', g:t.g||'', b:t.b||t.s, x:t.x||'', first:todayISO(),
          seen:0, ok:0, ng:0, ivl:0, ef:2.5, reps:0, lapses:0, due:todayISO(), last:''};
}
function grade(rec, correct){
  const today = todayISO();
  rec.seen++;
  if(correct){
    rec.ok++;
    rec.reps++;
    rec.ivl = rec.reps === 1 ? 1 : rec.reps === 2 ? 3 : Math.max(4, Math.round(rec.ivl * rec.ef));
    rec.ef = Math.min(2.8, rec.ef + 0.1);
  } else {
    rec.ng++; rec.lapses++; rec.reps = 0; rec.ivl = 1;
    rec.ef = Math.max(1.3, rec.ef - 0.2);
  }
  rec.due = addDays(today, rec.ivl);
  rec.last = today;
  WB[rec.s] = rec; writeLS(WB_KEY, WB);
  return rec;
}
const isMastered = r => r.ivl >= 21;
const isDue = r => (r.due || todayISO()) <= todayISO();
function bumpStats(correct){
  const t = todayISO();
  ST.days[t] = ST.days[t] || {q:0, ok:0};
  ST.days[t].q++; if(correct) ST.days[t].ok++;
  if(ST.last !== t){ ST.streak = (ST.last === addDays(t,-1)) ? (ST.streak||0)+1 : 1; ST.last = t; }
  writeLS(ST_KEY, ST);
}

/* 發音（瀏覽器內建日語語音，離線可用、不呼叫任何服務）
   沒有日語語音時 ttsOK=false → 聽力題不出、🔊 按鈕隱藏，不可變成無聲死題 */
let JA_VOICE = null, ttsOK = false;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    JA_VOICE = vs.find(v=>/^ja/i.test(v.lang)) || null;
    ttsOK = !!JA_VOICE;
    if(typeof onTTSReady === 'function') onTTSReady();
  }catch(e){ ttsOK = false; }
}
if(typeof speechSynthesis !== 'undefined' && LANG === 'ja'){
  pickVoice();
  try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){}
}
// iOS 規定：第一次發音必須在使用者點擊的同一個事件裡呼叫（不要包在 setTimeout 裡）
function say(text, slow){
  if(!ttsOK || !text) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.voice = JA_VOICE; u.rate = slow ? 0.7 : 0.9;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
/* @@SHARE-END */

/* ---------- 播放器 ---------- */
let yt = null, media = null, playing = false, curSeg = -1, curTok = -1;
// 播放器不可用時（禁止嵌入／載入失敗）不能再出聽力題，否則會是無聲死題
let audioOK = (D.kind !== 'youtube');
const stage = document.getElementById('stage');
if(D.kind === 'youtube'){
  const d = document.createElement('div'); d.id = 'ytp'; stage.appendChild(d);
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  // 嵌入失敗（禁止嵌入／origin 不符／地區限制）→ 換成連結，其他功能照用
  function embedFallback(code){
    const el = document.getElementById('ytp');
    if(!el || el.dataset.done) return;
    el.dataset.done = '1';
    audioOK = false;
    const n = document.createElement('div');
    n.className = 'fb';
    n.innerHTML = '<b>這部影片不能在這裡播放</b>' +
      '（YouTube 錯誤 ' + (code || '未知') + '）<br>' +
      '<a target="_blank" href="https://youtu.be/' + D.vid + '">在 YouTube 打開 ↗</a><br>' +
      '<span style="font-size:12px;opacity:.8">逐句、測驗、生詞都可以照用，聽力題會自動換成別的題型</span>';
    el.replaceWith(n);
  }
  window.onYouTubeIframeAPIReady = function(){
    yt = new YT.Player('ytp', { videoId: D.vid,
      playerVars:{rel:0, modestbranding:1, playsinline:1},
      events:{
        onReady:()=>{ audioOK = true; setInterval(tick,180); },
        onStateChange:e=>{ playing = (e.data===1); },
        onError:e=>embedFallback(e && e.data)      // 100/101/150/153 都走這裡
      } });
  };
  window.addEventListener('error', ()=>embedFallback(null), {once:true});
  setTimeout(()=>{ if(!yt && !document.getElementById('ytp')?.dataset.done) embedFallback('載入逾時'); }, 6000);
} else {
  media = document.createElement('video');
  media.src = D.media; media.controls = true; media.playsInline = true;
  stage.appendChild(media);
  media.addEventListener('timeupdate', tick);
  media.addEventListener('play', ()=>playing = true);
  media.addEventListener('pause', ()=>playing = false);
}
const now = () => (yt && yt.getCurrentTime) ? yt.getCurrentTime() : (media ? media.currentTime : 0);
function seek(t){ if(yt && yt.seekTo) yt.seekTo(t, true); else if(media) media.currentTime = t; }
let curRate = 1;
function playTo(t0, t1){
  seek(Math.max(t0 - 0.35, 0));
  // 慢速播放時音訊實際會拉長 → 停止時間必須按倍率換算，否則 0.75× 會被提早切掉
  const ms = Math.max(((t1 - t0 + 0.5) / curRate) * 1000, 900);
  if(yt && yt.playVideo){ yt.playVideo(); setTimeout(()=>{ if(yt && yt.pauseVideo) yt.pauseVideo(); }, ms); }
  else if(media){ media.play(); setTimeout(()=>media.pause(), ms); }
  return ms;
}
function rate(r){ curRate = r; if(yt && yt.setPlaybackRate) yt.setPlaybackRate(r); else if(media) media.playbackRate = r; }

/* ---------- 逐句 ---------- */
const segEls = [], tokEls = [];
// 拉丁語系（法／英）單詞之間一定要有空白；日文不加空白才是對的。
// 少了這個，法語課會渲染成 "BienvenueàSimplyFrenchPodcast."（實測線上就是這樣）
const LATIN = !['ja', 'zh'].includes((typeof D !== 'undefined' && D && D.lang) || 'ja');
function appendToks(container, si, toks){
  const out = [];
  toks.forEach((tk, j)=>{
    const sp = tokSpan(si, j, tk);
    container.appendChild(sp); out.push(sp);
    // 只在「下一個是實詞」時補空白：標點前不加（→ "Podcast." "va ?" 而不是 "Podcast ."）
    const nxt = toks[j + 1];
    if(LATIN && nxt && nxt.content) container.appendChild(document.createTextNode(' '));
  });
  return out;
}

// 詞元素（逐句頁與導讀頁共用一份，避免兩邊樣式走鐘）
function tokSpan(si, j, tk){
  const sp = document.createElement('span');
  sp.className = 'tok' + (tk.c ? ' course' : '') + (WB[tk.s] ? ' saved' : '');
  if(tk.r){
    // 原生 <ruby>：baseline 與換行交給瀏覽器，自己用 flex 疊字會歪掉並撐破版面
    const rb = document.createElement('ruby'); rb.textContent = tk.s;
    const rt = document.createElement('rt'); rt.textContent = tk.r;
    rb.appendChild(rt); sp.appendChild(rb);
  } else sp.textContent = tk.s;
  sp.onclick = ev=>{ ev.stopPropagation(); openSheet(si, j); };
  return sp;
}

function renderTranscript(){
  const tx = document.getElementById('viewT');
  SEGS.forEach((s,i)=>{
    const div = document.createElement('div'); div.className = 'seg';
    const tm = document.createElement('span'); tm.className = 'time'; tm.textContent = fmt(s.t0);
    tm.onclick = ()=>seek(Math.max(s.t0 - 0.15, 0));
    div.appendChild(tm); div.appendChild(document.createTextNode(' '));
    const toks = appendToks(div, i, s.tokens);
    if(s.zh){
      const z = document.createElement('span');
      z.className = 'segzh'; z.textContent = s.zh;
      div.appendChild(z);
    }
    tx.appendChild(div); segEls.push(div); tokEls.push(toks);
  });
  revealList(segEls);
}
let userScroll = 0;
['touchstart','wheel'].forEach(e=>document.getElementById('viewT')
  .addEventListener(e, ()=>userScroll = Date.now(), {passive:true}));
function tick(){
  const t = now();
  let si = -1;
  for(let i=0;i<SEGS.length;i++){ if(t >= SEGS[i].t0 && t < SEGS[i].t1 + 0.25){ si = i; break; } }
  if(si !== curSeg){
    if(curSeg >= 0 && segEls[curSeg]) segEls[curSeg].classList.remove('active');
    if(si >= 0){
      segEls[si].classList.add('active');
      if(playing && Date.now() - userScroll > 2500) segEls[si].scrollIntoView({block:'center', behavior:'smooth'});
    }
    curSeg = si; curTok = -1;
  }
  if(si < 0) return;
  const toks = SEGS[si].tokens;
  let tj = -1;
  for(let j=0;j<toks.length;j++){ if(t >= toks[j].t0 && t < toks[j].t1){ tj = j; break; } }
  if(tj !== curTok){
    if(curTok >= 0 && tokEls[si][curTok]) tokEls[si][curTok].classList.remove('hot');
    if(tj >= 0 && tokEls[si][tj] && toks[tj].content) tokEls[si][tj].classList.add('hot');
    curTok = tj;
  }
}

/* ---------- 詞卡 ---------- */
let pick = null;
function openSheet(i,j){
  const tk = SEGS[i].tokens[j];
  if(!tk.content) return;
  pick = {i,j,tk};
  document.getElementById('sw').textContent = tk.s;
  document.getElementById('srd').textContent = tk.r || '';
  document.getElementById('sgl').textContent = tk.g || '';
  document.getElementById('sctx').textContent = SEGS[i].text;

/* ---------- 動態層：粒子背景 + 進場動效 ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// 進場用 Web Animations API，且刻意「無延遲、不填滿」：
// 一旦用 delay + fill:'backwards'，動畫被暫停（切背景、省電、截圖）時元素會停在 opacity:0
// → 內容明明在 DOM 裡卻看不見。寧可效果樸素，也不要畫面空白。
function reveal(el){
  if(!el || RM || !el.animate) return;
  // 只做位移、完全不動 opacity：不論動畫是否被暫停，內容都一定看得見
  el.animate([{transform:'translateY(9px)'}, {transform:'none'}],
             {duration:300, easing:'cubic-bezier(.2,.8,.25,1)'});
}
function revealList(nodes){
  if(RM) return;
  nodes.forEach(n=>reveal(n));
}

/* 粒子：只在酷炫主題跑，切回柔和就停；分頁隱藏時暫停（省電） */
let fxRun = null;
function startFX(){
  if(RM) return;
  const c = document.getElementById('fx');
  if(!c || fxRun) return;
  const ctx = c.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0, pts = [], raf = 0;
  const ACC = '0,229,160', ACC2 = '34,211,238';
  function size(){
    w = c.clientWidth; h = c.clientHeight;
    c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed(){
    const n = Math.max(18, Math.min(38, Math.round(w / 22)));
    pts = Array.from({length:n}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-.5)*.24, vy: (Math.random()-.5)*.24,
      r: Math.random()*1.7 + .7
    }));
  }
  function frame(){
    if(!fxRun) return;
    ctx.clearRect(0, 0, w, h);
    for(const p of pts){
      p.x += p.vx; p.y += p.vy;
      if(p.x < -20) p.x = w + 20; if(p.x > w + 20) p.x = -20;
      if(p.y < -20) p.y = h + 20; if(p.y > h + 20) p.y = -20;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(' + ACC + ',.55)'; ctx.fill();
    }
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const a = pts[i], b = pts[j];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(d < 118){
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = 'rgba(' + ACC2 + ',' + (0.16 * (1 - d/118)).toFixed(3) + ')';
        ctx.lineWidth = .6; ctx.stroke();
      }
    }
    raf = requestAnimationFrame(frame);
  }
  const onResize = ()=>{ size(); seed(); };
  const onVis = ()=>{ if(document.hidden){ cancelAnimationFrame(raf); } else if(fxRun){ frame(); } };
  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', onVis);
  fxRun = ()=>{ fxRun = null; cancelAnimationFrame(raf);
                window.removeEventListener('resize', onResize);
                document.removeEventListener('visibilitychange', onVis); };
  size(); seed(); frame();
}
function stopFX(){ if(fxRun){ const f = fxRun; f(); } }

let gIdx = 0, gAuto = false, gSlow = false, gTimer = null;

function gPlay(){
  const s = SEGS[gIdx];

  const ms = playTo(s.t0, s.t1);

      else { gAuto = false; G('gauto').classList.remove('on'); }
    }, ms + 700);
  }
}
function gGo(d){

  gIdx = Math.max(0, Math.min(SEGS.length - 1, gIdx + d));

/* ---------- 生詞本 ---------- */
function lessonWords(){
  // 題庫只收「該考的詞」：排除助詞／助動詞／數詞等功能詞（建置期已標 fn），
  // 否則選項會出現「した」「2016」這種噪音。
  const map = new Map();
  SEGS.forEach((s,si)=>s.tokens.forEach(tk=>{
    if(!tk.content || tk.fn || tk.s.length < 2) return;
    if(/^[\d\s.,:;!?·\-—…]+$/.test(tk.s)) return;
    if(!map.has(tk.s)) map.set(tk.s, {s:tk.s, r:tk.r||'', g:tk.g||'', b:tk.b||tk.s, si, t0:tk.t0, t1:tk.t1});
  }));
  return [...map.values()];
}

  document.getElementById('wstat').innerHTML =
    '<div><b>'+all.length+'</b><span>收集詞數</span></div>' +

    '<div><b>'+(ST.streak||0)+'</b><span>連續天數</span></div>';

  }
  // 篩選 + 搜尋

      (r.g ? '<span class="vg">'+r.g+'</span>' : '') +

    del.onclick = ()=>delWord(w);
    d.appendChild(left); d.appendChild(del); box.appendChild(d);
  });
  revealList(Array.from(box.children));
  updateDuePill();
  refreshPoolLabel();

/* ---------- 測驗 ---------- */
let queue = [], qi = 0, cur = null, answered = false, pool = [];
/* @@SHARE-BEGIN */
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
/* @@SHARE-END */

/* 測驗設定：題型 / 範圍 / 題數都讓使用者自己選（預設全部・本課・10 題） */
const QCFG = {kind:'all', scope:'lesson', n:10};

function quizWords(){
  const all = lessonWords();
  if(QCFG.scope === 'saved') return all.filter(w=>WB[w.s]);
  if(QCFG.scope === 'due')   return all.filter(w=>WB[w.s] && isDue(WB[w.s]));
  return all;
}
function canKind(w, k){
  if(k === 'mean')   return !!w.g;
  if(k === 'listen') return audioOK;
  if(k === 'read')   return !!w.r;
  return true;                                  // cloze 由 buildQ 再判斷
}
function refreshPoolLabel(){
  const n = quizWords().length;
  const b = document.getElementById('qstart');
  if(b && b.style.display !== 'none') b.innerHTML = '開始練習 · <b id="qpool">' + n + '</b> 個詞';
  const hint = document.getElementById('qhint');
  if(hint){
    let msg = '';
    if(!n) msg = QCFG.scope === 'due'   ? '今天沒有到期的詞 —— 改選「本課全部」或「我收藏的」'
             : QCFG.scope === 'saved' ? '生詞本還是空的 —— 先在逐句頁點單字加入生詞'
             : '';
    hint.textContent = msg;
    hint.style.display = msg ? 'block' : 'none';
  }
}
function bindChips(id, cb){
  const box = document.getElementById(id);
  if(!box) return;
  box.addEventListener('click', ev=>{
    const b = ev.target.closest ? ev.target.closest('.chip') : null;
    if(!b) return;
    Array.from(box.querySelectorAll('.chip')).forEach(c=>c.classList.toggle('on', c === b));
    cb(b.dataset || {});
  });
}
bindChips('ckind',  d=>{ QCFG.kind  = d.k || 'all'; });
bindChips('cscope', d=>{ QCFG.scope = d.s || 'lesson'; refreshPoolLabel(); });
bindChips('cnum',   d=>{ QCFG.n     = parseInt(d.n || '10', 10); });

function startQuiz(){
  pool = lessonWords();
  let words = quizWords();
  if(QCFG.kind !== 'all') words = words.filter(w=>canKind(w, QCFG.kind));
  if(!words.length){ showEmpty(); return; }
  queue = shuffle(words);
  if(QCFG.n > 0) queue = queue.slice(0, QCFG.n);
  qi = 0;
  const cfg = document.getElementById('qcfg'); if(cfg) cfg.style.display = 'none';
  document.getElementById('qstart').style.display = 'none';
  document.getElementById('qempty').style.display = 'none';
  nextQ();
}
function showEmpty(){
  const cfg = document.getElementById('qcfg'); if(cfg) cfg.style.display = 'flex';
  refreshPoolLabel();
  document.getElementById('qstem').textContent = '';
  document.getElementById('opts').innerHTML = '';
  document.getElementById('qempty').style.display = 'block';
  document.getElementById('qnext').style.display = 'none';
}
function nextQ(){
  answered = false; cur = null;
  document.getElementById('qfeed').textContent = '';
  document.getElementById('qfeed').className = 'feed';
  document.getElementById('qnext').style.display = 'none';
  if(qi >= queue.length){
    document.getElementById('qtype').textContent = '完成';
    document.getElementById('qprog').textContent = queue.length + ' / ' + queue.length;
    document.getElementById('qstem').textContent = '這輪練完了 👏';
    document.getElementById('opts').innerHTML = '';
    document.getElementById('qstart').style.display = 'block';
    const cfg = document.getElementById('qcfg'); if(cfg) cfg.style.display = 'flex';
    refreshPoolLabel();
    document.getElementById('qempty').style.display = 'block';
    document.getElementById('qempty').innerHTML = '答題紀錄已存到這台裝置。<br>生詞頁可看掌握度與下次複習日。';
    return;
  }
  const w = queue[qi];
  let kinds;
  if(QCFG.kind !== 'all'){
    kinds = [QCFG.kind];
  } else {
    kinds = ['read','cloze'];
    if(audioOK) kinds.push('listen');
    if(w.g) kinds.push('mean');
  }
  // 逐一嘗試題型，直到有一型能湊出四個選項（干擾項不夠就換下一型）
  cur = null;
  for(const k of shuffle(kinds)){ cur = buildQ(w, k, pool); if(cur) break; }
  if(!cur) cur = {label:'複習', stem:'<b>'+w.s+'</b>', options:[{text:'看懂 → 下一題', correct:true}]};
  document.getElementById('qtype').textContent = cur.label;
  document.getElementById('qprog').textContent = (qi+1) + ' / ' + queue.length;
  document.getElementById('qstem').innerHTML = cur.stem;
  const box = document.getElementById('opts'); box.innerHTML = '';
  const opts = cur.options;
  opts.forEach(o=>{
    const b = document.createElement('button'); b.className = 'opt'; b.textContent = o.text;
    b.onclick = ()=>answer(b, o.correct);
    box.appendChild(b);
  });
  revealList(Array.from(box.children));
  if(cur.audio) setTimeout(()=>playTo(cur.audio[0], cur.audio[1]), 350);
}
/* @@SHARE-BEGIN */
// 四選項契約：湊不出四個互不重複的選項就回 null，由上層換題型（不可拿掉）
function q4(label, stem, correctText, wrongTexts, audio){
  const seen = new Set([correctText]);
  const opts = [{text:correctText, correct:true}];
  for(const t of wrongTexts){
    if(seen.has(t)) continue;
    seen.add(t);
    opts.push({text:t, correct:false});
    if(opts.length === 4) break;
  }
  if(opts.length < 4) return null;          // 干擾項不夠 → 交給上層換題型
  return {label, stem, options:shuffle(opts), audio};
}
/* @@SHARE-END */
function buildQ(w, kind, pool){
  const others = (pool||[]).filter(x=>x.s !== w.s);
  const pickWrong = key => shuffle(others.filter(x=>x[key] && x[key] !== w[key]));
  const fmtW = x => x.s + (x.r ? '（'+x.r+'）' : '');

  if(kind === 'read' && w.r)
    return q4('讀音', '<b>'+w.s+'</b><small>這個詞怎麼唸？</small>',
              w.r, pickWrong('r').map(x=>x.r));
  if(kind === 'mean' && w.g)
    return q4('詞義', '<b>'+w.s+'</b>' + (w.r ? ' <small style="display:inline;color:var(--lav)">'+w.r+'</small>' : '') +
              '<small>是什麼意思？</small>', w.g, pickWrong('g').map(x=>x.g));
  if(kind === 'listen')
    return q4('聽力', '🔊 <small>聽這個詞，選出你聽到的</small>',
              fmtW(w), others.map(fmtW), [w.t0, w.t1]);
  if(kind === 'cloze'){
    const seg = SEGS[w.si];
    const masked = seg.text.replace(w.s, '<span class="blank">＿＿＿</span>');
    if(!masked.includes('blank')) return null;
    return q4('克漏字', masked + '<small>選出最適合填入的詞</small>',
              fmtW(w), others.map(fmtW), [seg.t0, seg.t1]);
  }
  return null;
}
function answer(btn, correct){
  if(answered) return;
  answered = true;
  const w = queue[qi];
  // 找出正確選項文字（可能與 btn 不同）
  document.querySelectorAll('.opt').forEach(b=>{
    if(b === btn){ b.classList.add(correct ? 'correct' : 'wrong'); }
  });
  // 標出正解
  const right = cur.options.find(o=>o.correct);
  document.querySelectorAll('.opt').forEach(b=>{ if(b.textContent === right.text) b.classList.add('correct'); });
  const rec = WB[w.s] ? WB[w.s] : newRec(Object.assign({}, w, {x:(SEGS[w.si]||{}).text||''}));
  grade(rec, correct);
  bumpStats(correct);
  const f = document.getElementById('qfeed');
  f.className = 'feed ' + (correct ? 'ok' : 'ng');
  f.innerHTML = (correct ? '✔ 正確' : '✘ 答錯了') +
    '　<b>' + w.s + '</b>' + (w.r ? '（'+w.r+'）' : '') + (w.g ? '　' + w.g : '') +
    '<br><span style="color:var(--dim);font-size:12px">下次複習：' + rec.due + '</span>';
  document.getElementById('qnext').style.display = 'block';
  qi++;
  renderWordbook();
}
document.getElementById('qnext').onclick = nextQ;
document.getElementById('qstart').onclick = ()=>startQuiz();

/* ---------- 分頁 / 按鈕 ---------- */
function tab(name){
  ['G','T','Q','W'].forEach(k=>{
    document.getElementById('view'+k).classList.toggle('show', k === name);
    document.getElementById('tab'+k).classList.toggle('on', k === name);
  });
  if(name === 'G'){ renderGuide(); paintZhBtn(); }
  if(name === 'W') renderWordbook();
  if(name === 'Q'){ refreshPoolLabel(); }
  const sec = document.getElementById('view' + name);
  if(sec && sec.animate && !RM){
    sec.animate([{transform:'translateY(8px)'}, {transform:'none'}],
                {duration:260, easing:'cubic-bezier(.2,.8,.25,1)'});
  }
}
document.getElementById('tabG').onclick = ()=>tab('G');
document.getElementById('tabT').onclick = ()=>tab('T');
document.getElementById('tabQ').onclick = ()=>tab('Q');
document.getElementById('tabW').onclick = ()=>tab('W');

// 慢速：導讀頁與逐句頁共用同一個狀態
function setSpeed(v){
  gSlow = v; rate(v ? 0.75 : 1);
  document.getElementById('gspeed').classList.toggle('on', v);
  document.getElementById('slow').classList.toggle('on', v);
}
document.getElementById('furi').onclick = e=>{
  const off = document.body.classList.toggle('nofuri');
  e.target.classList.toggle('on', !off);
};
document.getElementById('slow').onclick = ()=>setSpeed(!gSlow);

// 主題：柔和（預設，適合她）／酷炫（深色 HUD）
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('lk.theme', t); }catch(e){}
  document.getElementById('theme').textContent = (t === 'cool') ? '🌸 柔和版' : '🎨 酷炫版';
  if(t === 'cool') startFX(); else stopFX();
}
document.getElementById('theme').onclick =
  ()=>applyTheme(document.documentElement.dataset.theme === 'cool' ? 'soft' : 'cool');
applyTheme(document.documentElement.dataset.theme || 'soft');
document.getElementById('rep').onclick = ()=>{
  if(curSeg < 0) return; const s = SEGS[curSeg];
  seek(Math.max(s.t0 - 0.2, 0)); if(yt && yt.playVideo) yt.playVideo();
};
function fmt(t){ const m = Math.floor(t/60), s = Math.floor(t%60); return m + ':' + String(s).padStart(2,'0'); }

renderTranscript(); renderGuide(); renderWordbook();
</script>
