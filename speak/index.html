<!doctype html>
<html lang="zh-Hant" data-theme="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的語言課">

<title>聽說起步 — 日語起步</title>
<style>
:root{
  --bg:#FFF8F4; --card:#FFFFFF; --line:#F5E1E8; --fg:#432F37; --dim:#957D86;
  --rose:#EF6A8B; --rose-d:#D94F72; --lav:#9B6BD6; --peach:#FF9466; --mint:#43BE9B; --bad:#D9737A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Yuanti TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.7;padding:0 0 calc(96px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{padding:16px 16px 6px}
.crumb{display:inline-block;font-size:13px;color:var(--dim);text-decoration:none}
h1{font-size:19px;margin:6px 0 10px;font-weight:800}
h1 span{color:var(--rose-d)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);font-weight:600}
.pill b{color:var(--fg)}
.wrap{padding:0 16px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:13.5px;font-weight:700;cursor:pointer;min-height:38px}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 4px 12px rgba(239,106,139,.28)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;
  box-shadow:0 4px 18px rgba(214,124,147,.10);margin-bottom:14px}
.ask{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.big{font-size:26px;line-height:1.6;font-weight:800;margin:6px 0 14px;min-height:44px}
.big ruby rt{font-size:.42em;color:var(--lav);font-weight:600}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
button.act{padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:15px;font-weight:700;cursor:pointer;min-height:46px;font-family:inherit}
button.act.primary{background:linear-gradient(135deg,#FF9DB4,#EF6A8B);color:#fff;border-color:transparent;
  box-shadow:0 5px 16px rgba(239,106,139,.32)}
button.act:active{transform:scale(.97)}
button.act[disabled]{opacity:.45}
.opts{display:grid;gap:9px;margin-top:6px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font-size:16px;font-weight:700;cursor:pointer;min-height:52px;font-family:inherit}
.opt:active{transform:scale(.99)}
.opt.correct{background:rgba(67,190,155,.16);border-color:var(--mint);color:#26755F}
.opt.wrong{background:rgba(217,115,122,.14);border-color:var(--bad);color:#A24B52}
.feed{margin-top:12px;font-size:14px;min-height:22px;font-weight:700}
.feed.ok{color:#26755F}.feed.ng{color:#A24B52}
.tip{color:var(--dim);font-size:12.5px;line-height:1.9}
.warn{background:#FFF4E8;border:1px solid #FFD9B8;color:#8A5327;border-radius:14px;
  padding:11px 13px;font-size:13px;line-height:1.75;margin-top:10px}
.bar{height:9px;border-radius:999px;background:#FBE7EE;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#FFB3C4,#EF6A8B);transition:width .3s}
.rec{display:flex;align-items:center;gap:10px;margin-top:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.dot.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
audio{width:100%;margin-top:10px}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:18px 6px}
/* 還沒開始時只留一顆大按鈕，不要一開始就丟三顆讓人猜 */
body:not(.inq) #playBtn,body:not(.inq) #slowBtn{display:none}
body:not(.inq) #startBtn{width:100%;min-height:56px;font-size:17px}
body.inq #startBtn{display:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header>
  <a class="crumb" href="../index.html">← 課程列表</a>
  <a class="crumb" href="../dialog/index.html" style="margin-left:10px">🎭 情境對話</a>
  <h1>聽說起步 <span>· 日語起步</span></h1>
  <div class="pills">
    <span class="pill">🔥 連續 <b id="streak">0</b> 天</span>
    <span class="pill">今天 <b id="todayN">0</b> 題</span>
    <span class="pill">⭐ <b id="xp">0</b> XP</span>
  </div>
</header>

<div class="wrap">
  <div class="warn" id="ttsNote" style="display:none;margin:0 0 10px"></div>
  <div class="chips" id="modes">
    <button class="chip on" data-m="listen">① 聽音選詞</button>
    <button class="chip" data-m="mean">② 聽句選意</button>
    <button class="chip" data-m="shadow">③ 跟讀錄音</button>
    <button class="chip" data-m="ladder">④ 聽力階梯</button>
  </div>

  <section id="play">
    <div class="card">
      <div class="ask" id="askLabel">聽，然後選出你聽到的詞</div>
      <div class="big" id="stem">按下面的按鈕開始</div>
      <div class="btnrow">
        <button class="act primary" id="playBtn">🔊 播放</button>
        <button class="act" id="slowBtn">🐢 慢速</button>
        <button class="act" id="startBtn">開始練習</button>
      </div>
      <div class="bar"><i id="prog"></i></div>
      <div class="opts" id="opts"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="card" id="shadowCard" style="display:none">
      <div class="ask">跟讀：先聽一次 → 按錄音念一次 → 回放自己聽</div>
      <div class="big" id="sStem"></div>
      <div id="sMeaning" class="tip"></div>
      <div class="btnrow" style="margin-top:12px">
        <button class="act primary" id="sPlay">🔊 聽一次</button>
        <button class="act" id="sRec">🎙 錄音</button>
        <button class="act" id="sNext">下一句 →</button>
      </div>
      <div class="rec" id="recRow" style="display:none"><span class="dot live" id="recDot"></span><span class="tip">錄音中…再按一次停止</span></div>
      <audio id="sAudio" controls style="display:none"></audio>
      <div class="warn" id="micWarn" style="display:none"></div>
    </div>
  </section>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const ITEMS = D.items || [];
const $ = id => document.getElementById(id);

/* ---------- 語音（瀏覽器內建，離線可用；iOS 需在使用者點擊事件裡第一次呼叫） ---------- */
let VOICE = null, ttsOK = false;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    VOICE = vs.find(v => /^ja/i.test(v.lang)) || null;
    ttsOK = !!VOICE;
  }catch(e){ ttsOK = false; }
}
if(typeof speechSynthesis !== 'undefined'){
  pickVoice();
  try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){}
}
let ttsNoted = false;
function noteTTS(){
  if(ttsNoted) return;
  ttsNoted = true;
  const el = $('ttsNote');
  if(el){ el.style.display = 'block';
    el.textContent = 'ℹ️ 這台還沒裝日語語音：設定 → 輔助使用 → 朗讀內容 → 聲音 → 日文（下載一個就好，之後離線也能用）'; }
}
function say(text, slow){
  if(!text) return false;
  if(!ttsOK){ noteTTS(); return false; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.voice = VOICE; u.rate = slow ? 0.7 : 0.95;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* ---------- 紀錄（只存這台裝置；跟影片課的詞庫分開，避免互相汙染） ---------- */
const KEY = 'lk.spk.v1.ja';
const isoLocal = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO = () => isoLocal(new Date());
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoLocal(dt); }
let S = {days:{}, streak:0, last:'', xp:0};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function bump(correct){
  const t = todayISO();
  S.days[t] = S.days[t] || {q:0, ok:0};
  S.days[t].q++; if(correct){ S.days[t].ok++; S.xp = (S.xp||0) + 1; }
  if(S.last !== t){ S.streak = (S.last === addDays(t,-1)) ? (S.streak||0)+1 : 1; S.last = t; }
  save(); paintStats();
}
function paintStats(){
  const t = S.days[todayISO()] || {q:0};
  $('streak').textContent = S.streak || 0;
  $('todayN').textContent = t.q || 0;
  $('xp').textContent = S.xp || 0;
}

/* ---------- 出題（全部在瀏覽器即時組，資料建置期就算好） ---------- */
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function pick(arr, n){ return shuffle(arr).slice(0, n); }
function sameUnit(w, pool, n){
  const u = pool.filter(x => x.u === w.u && x.w !== w.w);
  const rest = pool.filter(x => x.u !== w.u && x.w !== w.w);
  return pick(u, n).concat(pick(rest, n)).slice(0, n);
}

let mode = 'listen', q = null, answered = false, done = 0, total = 10, si = 0;

/* 聽力階梯：不是單純調速度，而是「句子長度」三階（短 → 中 → 長），
   全部用正常語速 —— 真實對話不會為她放慢。每階 5 題，答對 4 題才升階。 */
const LADDER = [
  {name:'短句（5–10 個字）', pick:x=>x.x.length<=10},
  {name:'中句（11–16 字）',  pick:x=>x.x.length>10 && x.x.length<=16},
  {name:'長句（17 字以上）', pick:x=>x.x.length>16},
];
let lv = 0, lvScore = 0, lvCount = 0;
const LADDER_KEY = 'lk.spk.ladder.ja';
try{ const r = localStorage.getItem(LADDER_KEY); if(r){ const o = JSON.parse(r); lv = o.lv|0; } }catch(e){}
function saveLadder(){ try{ localStorage.setItem(LADDER_KEY, JSON.stringify({lv:lv})); }catch(e){} }
function ladderNext(){
  answered = false; $('feed').textContent = ''; $('feed').className = 'feed';
  const pool = ITEMS.filter(LADDER[lv].pick);
  const use = pool.length ? pool : ITEMS;
  const w = use[Math.floor(Math.random()*use.length)];
  const others = shuffle(ITEMS.filter(x=>x.x !== w.x)).slice(0,3).map(x=>({t:x.xcn}));
  const opts = shuffle([{t:w.xcn, ok:true}].concat(others.map(o=>({t:o.t, ok:false}))));
  q = {kind:'ladder', say:w.x, answer:w.xcn, opts:opts.map(o=>o.t), w:w};
  $('askLabel').textContent = '第 ' + (lv+1) + ' 關・' + LADDER[lv].name +
    '（' + (lvCount+1) + '/5，答對 ' + lvScore + '）';
  $('stem').textContent = '🔊 正常語速，聽一次';
  renderOpts();
  $('prog').style.width = (lvCount / 5 * 100) + '%';
  setTimeout(()=>say(w.x, false), 240);
}
function ladderAnswer(correct){
  lvCount++; if(correct) lvScore++;
  bump(correct);
  if(lvCount >= 5){
    if(lvScore >= 4 && lv < LADDER.length - 1){
      lv++; lvScore = 0; lvCount = 0; saveLadder();
      $('feed').className = 'feed ok';
      $('feed').textContent = '🎉 升到第 ' + (lv+1) + ' 關：' + LADDER[lv].name;
      setTimeout(ladderNext, 1600);
    } else if(lvScore >= 4 && lv === LADDER.length - 1){
      $('feed').className = 'feed ok';
      $('feed').textContent = '🏆 最高階通過！長句也聽得懂了，去「情境對話」用出來。';
      lvScore = 0; lvCount = 0;
      setTimeout(ladderNext, 2000);
    } else {
      $('feed').className = 'feed';
      $('feed').textContent = '這一關答對 ' + lvScore + '/5，再練一次同一個長度（答對 4 題才升階）';
      lvScore = 0; lvCount = 0;
      setTimeout(ladderNext, 1800);
    }
    return;
  }
  setTimeout(ladderNext, 1500);   // 同關卡內繼續下一題
}

function nextQuestion(){
  answered = false; $('feed').textContent = ''; $('feed').className = 'feed';
  if(done >= total){ finish(); return; }
  const w = ITEMS[(si++ * 7 + Math.floor(Math.random()*ITEMS.length)) % ITEMS.length];
  if(mode === 'listen'){
    // 聽音選詞：播詞，四個選項都是同單元的詞（難度相近，考耳朵不是考記憶）
    const opts = shuffle([w].concat(sameUnit(w, ITEMS, 3).map(x=>({w:x.w}))));
    q = {kind:'listen', say:w.w, answer:w.w, opts:opts.map(o=>o.w)};
    $('askLabel').textContent = '聽，然後選出你聽到的詞';
    $('stem').textContent = '🔊 按播放，仔細聽';
  } else if(mode === 'mean'){
    // 聽句選意：播例句，選中文意思（聽懂優先，不看字）
    const others = sameUnit(w, ITEMS, 3).map(x=>({t:x.xcn}));
    const opts = shuffle([{t:w.xcn, ok:true}].concat(others.map(o=>({t:o.t, ok:false}))));
    q = {kind:'mean', say:w.x, answer:w.xcn, opts:opts.map(o=>o.t)};
    $('askLabel').textContent = '聽一整句，選出它的意思';
    $('stem').textContent = '🔊 按播放，先不要看字';
  }
  renderOpts();
  $('prog').style.width = (done / total * 100) + '%';
  if(mode !== 'shadow') setTimeout(()=>say(q.say, false), 260);
}
function renderOpts(){
  const box = $('opts'); box.innerHTML = '';
  q.opts.forEach(txt=>{
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = txt;
    b.onclick = ()=>answer(b, txt === q.answer);
    box.appendChild(b);
  });
}
function answer(btn, correct){
  if(answered) return;
  answered = true;
  document.querySelectorAll('.opt').forEach(b=>{
    if(b.textContent === q.answer) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  if(mode === 'ladder'){
    const w = q.w;
    $('feed').className = 'feed ' + (correct ? 'ok' : 'ng');
    $('feed').textContent = (correct ? '✔ 對了' : '✘ 再聽一次') +
      '　' + w.x + '（' + w.xcn + '）';
    ladderAnswer(correct);   // 進下一題的排程交給 ladderAnswer，避免重複觸發
    return;
  }
  const item = ITEMS.find(x => x.w === q.answer || x.xcn === q.answer) || {};
  $('feed').className = 'feed ' + (correct ? 'ok' : 'ng');
  $('feed').textContent = (correct ? '✔ 對了' : '✘ 再聽一次') +
    (item.x ? '　' + item.x + (item.xcn ? '（' + item.xcn + '）' : '') : '');
  bump(correct);
  done++;
  setTimeout(nextQuestion, 1400);
}
function finish(){
  $('askLabel').textContent = '這一輪完成';
  $('stem').textContent = '👏 今天 ' + done + ' 題完成';
  $('opts').innerHTML = '';
  const t = S.days[todayISO()] || {q:0, ok:0};
  $('feed').className = 'feed ok';
  $('feed').textContent = '今天共 ' + t.q + ' 題，正確率 ' + (t.q ? Math.round(t.ok/t.q*100) : 0) + '%　連續 ' + (S.streak||0) + ' 天';
  $('prog').style.width = '100%';
}
function startRound(){
  done = 0; total = 10; si = Math.floor(Math.random()*ITEMS.length);
  document.body.classList.add('inq');
  $('startBtn').style.display = 'none';
  $('opts').innerHTML = '';
  nextQuestion();
}
function idle(){
  document.body.classList.remove('inq');
  $('startBtn').style.display = 'block';
  $('startBtn').textContent = '▶ 開始練習（10 題，約 2 分鐘）';
  $('opts').innerHTML = '';
  $('feed').textContent = '';
  $('prog').style.width = '0';
}

/* ---------- 跟讀（錄音需要 HTTPS 或 localhost，一般 http 區網會被瀏覽器擋） ---------- */
let rec = null, chunks = [], stream = null;
function warn(msg, soft){
  const el = $('micWarn');
  if(!msg){ el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'block';
  el.textContent = msg;
  el.style.background = soft ? '#EEF6FF' : '#FFF4E8';
  el.style.borderColor = soft ? '#CBDDF5' : '#FFD9B8';
  el.style.color = soft ? '#2C5079' : '#8A5327';
}
function canRecord(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
async function toggleRec(){
  if(!canRecord()){
    $('micWarn').style.display = 'block';
    $('micWarn').innerHTML = '這台裝置／這個網址不能錄音。瀏覽器規定麥克風只能在 <b>HTTPS</b> 或 <b>localhost</b> 使用，' +
      '現在是用 http 區網網址開的。<br>要錄音請改走發佈後的 https 網址（或先用「聽一次」跟著念，不錄音也能練）。';
    return;
  }
  if(rec && rec.state === 'recording'){
    rec.stop();
    $('recRow').style.display = 'none';
    return;
  }
  // 有些環境（無頭瀏覽器、被擋的權限視窗）getUserMedia 會一直不回應 →
  // 一定要有超時提示，不能讓她按了錄音鍵卻什麼都沒發生
  warn('正在等麥克風權限…（瀏覽器通常會跳「允許」視窗）', true);
  const guard = setTimeout(()=>{
    if(!rec || rec.state !== 'recording')
      warn('麥克風沒有回應。常見原因：① 網址不是 https（只有 localhost 或 https 能用麥克風）② 權限視窗被關掉了 ③ 系統設定裡關了 Safari 的麥克風。');
  }, 2600);
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    clearTimeout(guard);
    chunks = [];
    const type = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    rec = new MediaRecorder(stream, type ? {mimeType:type} : undefined);
    rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    rec.onstop = ()=>{
      const blob = new Blob(chunks, {type: chunks[0] ? chunks[0].type : 'audio/mp4'});
      const a = $('sAudio');
      a.src = URL.createObjectURL(blob); a.style.display = 'block';
      a.play().catch(()=>{});
      if(stream) stream.getTracks().forEach(t=>t.stop());
      $('recDot').classList.remove('live');
    };
    rec.start();
    warn('', false);
    $('recRow').style.display = 'flex';
    $('recDot').classList.add('live');
  }catch(e){
    warn('麥克風打不開（' + (e && e.name || '未知') + '）。請確認已允許麥克風權限，或改用 https 網址。');
  }
}
function shadowShow(){
  const w = ITEMS[si % ITEMS.length];
  $('sStem').innerHTML = w.rt || w.w;
  $('sMeaning').textContent = (w.w !== w.x ? w.w + (w.r ? '（' + w.r + '）' : '') + '・' : '') +
    (w.xcn || w.g || '');
  $('sAudio').style.display = 'none';
  $('micWarn').style.display = 'none';
}
function setMode(m){
  mode = m;
  document.querySelectorAll('#modes .chip').forEach(c=>c.classList.toggle('on', c.dataset.m === m));
  const shadow = m === 'shadow';
  $('shadowCard').style.display = shadow ? 'block' : 'none';
  $('opts').style.display = shadow ? 'none' : 'grid';
  const card = $('play').firstElementChild;
  card.style.display = shadow ? 'none' : 'block';
  $('startBtn').style.display = shadow ? 'none' : 'block';
  if(shadow){ shadowShow(); }
  else if(m === 'ladder'){
    idle();
    document.body.classList.add('inq');
    $('startBtn').style.display = 'none';
    lvCount = 0; lvScore = 0;
    ladderNext();
  }
  else { idle(); startRound(); }
}

/* ---------- 綁定 ---------- */
document.querySelectorAll('#modes .chip').forEach(c=>c.onclick = ()=>setMode(c.dataset.m));
$('playBtn').onclick = ()=>{ if(q) say(q.say, false); };
$('slowBtn').onclick = ()=>{ if(q) say(q.say, true); };
$('startBtn').onclick = startRound;
$('sPlay').onclick = ()=>{ const w = ITEMS[si % ITEMS.length]; say(w.x || w.w, false); };
$('sRec').onclick = toggleRec;
$('sNext').onclick = ()=>{ si++; shadowShow(); };

paintStats();
if(!ITEMS.length){
  $('stem').textContent = '沒有資料，請先跑 python3 make_speak.py';
}else{
  $('stem').textContent = ITEMS.length + ' 句可以練';
  $('askLabel').textContent = '先練耳朵：按開始，聽一句選一個（不用看懂字）';
  $('startBtn').textContent = '▶ 開始練習（10 題，約 2 分鐘）';
}
</script>
