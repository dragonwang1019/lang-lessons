<!doctype html>
<html lang="zh-Hant" data-theme="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的語言課">
<meta name="theme-color" content="#FFF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8F4">
<title>每日練習</title>
<script>try{var t=localStorage.getItem('lk.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* 與教材頁同一組 token：柔和版預設，酷炫版只換顏色（本頁不跑粒子，專心作答） */
:root{
  --bg:#FFF8F4; --bg-soft:#FFFDFB; --card:#FFFFFF; --line:#F5E1E8;
  --fg:#432F37; --dim:#957D86; --ink:#4A2F38;
  --rose:#EF6A8B; --rose-d:#D94F72; --lav:#9B6BD6; --peach:#FF9466;
  --mint:#43BE9B; --mint-d:#1F7A5F; --bad:#C0392B;
  --t0:#EBDDE2; --t1:#C9A6F0; --t2:#7DDBBE; --t3:#FF8FA8;
  --hero:linear-gradient(160deg,#FFE6EE 0%,#FFF1E2 100%);
  --btn:linear-gradient(135deg,#FF9DB4,#EF6A8B);
  --shadow:0 3px 14px rgba(214,124,147,.10);
  --r-card:20px; --r-btn:999px;
}
html[data-theme="cool"]{
  --bg:#0B0E14; --bg-soft:#0F141C; --card:#111823; --line:#233043;
  --fg:#E6F1FF; --dim:#7E8FA6; --ink:#E6F1FF;
  --rose:#00E5A0; --rose-d:#00C48C; --lav:#6EE7FF; --peach:#FFB020;
  --mint:#00E5A0; --mint-d:#00E5A0; --bad:#FF5C7A;
  --t0:#2A3646; --t1:#FFB020; --t2:#22D3EE; --t3:#00E5A0;
  --hero:#0F141C;
  --btn:linear-gradient(135deg,#00E5A0,#22D3EE);
  --shadow:0 0 0 1px #1E2A3A,0 8px 24px rgba(0,0,0,.5);
  --r-card:6px; --r-btn:5px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);line-height:1.7;
  font-family:"Hiragino Maru Gothic ProN","Yuanti TC","PingFang TC",-apple-system,
    BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom));overflow-x:hidden}
html[data-theme="cool"] body{background-image:linear-gradient(rgba(0,229,160,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,229,160,.04) 1px,transparent 1px);background-size:26px 26px}

header{position:sticky;top:0;z-index:20;background:var(--hero);padding:10px 16px 12px;
  border-radius:0 0 20px 20px;box-shadow:0 3px 16px rgba(214,140,160,.14)}
html[data-theme="cool"] header{border-radius:0;border-bottom:1px solid var(--line);box-shadow:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.crumb{font-size:13px;color:var(--dim);text-decoration:none}
h1{font-size:18px;margin:4px 0 6px;color:var(--ink);letter-spacing:.01em}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;
  padding:1.5px 10px;font-size:11.5px;color:var(--dim)}
html[data-theme="cool"] .pill{background:#0B0E14;border-radius:3px}
.pill.hot{color:var(--rose-d);font-weight:700}

main{padding:14px 14px 0;max-width:640px;margin:0 auto}
section{display:none}
section.show{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ph{font-size:16px;margin:2px 0 10px;color:var(--ink);font-weight:800}
.ph small{font-weight:500;font-size:12px;color:var(--dim);margin-left:6px}
h3{font-size:13.5px;margin:0 0 10px;color:var(--ink)}
.dim{color:var(--dim);font-size:12.5px;line-height:1.9}

/* color 不要放進 transition：過渡中途會出現白字白底的隱形按鈕 */
button{font:inherit;font-size:13px;color:var(--fg);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-btn);padding:8px 14px;min-height:38px;
  cursor:pointer;transition:transform .15s,box-shadow .15s}
button:active{transform:scale(.97)}
button.big{display:block;width:100%;min-height:52px;font-size:16px;font-weight:800;color:#fff;
  background:var(--btn);border-color:transparent;box-shadow:0 4px 14px rgba(239,106,139,.3)}
html[data-theme="cool"] button.big{color:#04120C}
button.ghost{background:transparent}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 13px;min-height:34px;font-weight:600}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
html[data-theme="cool"] .chip.on{color:#04120C}
.needtts{display:none !important}
body.tts .needtts{display:inline-flex !important}
.say{min-height:34px;padding:5px 11px;font-size:13px}

ruby{ruby-position:over}
rt{font-size:.5em;color:var(--lav);font-weight:600;letter-spacing:.02em}

/* ── 今天 ── */
.today{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--t0)}
.ring .fgc{stroke:var(--rose);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.25,1)}
.ring text{fill:var(--ink);font-size:21px;font-weight:800;text-anchor:middle}
.ring .rs{font-size:9.5px;fill:var(--dim);font-weight:600}
.tasks{display:flex;flex-direction:column;gap:4px;font-size:14px}
.tasks b{font-size:20px;color:var(--rose-d);margin-right:3px}
.go{margin-top:14px}
.exam{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.exam input{font:inherit;padding:7px 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);min-height:38px}
.tipcard{background:linear-gradient(135deg,rgba(255,148,102,.13),rgba(239,106,139,.10));
  border-color:#FFD3C2}
html[data-theme="cool"] .tipcard{background:rgba(255,176,32,.08);border-color:#4A3A18}
.lessons a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;
  color:var(--fg);padding:10px 0;border-top:1px dashed var(--line);font-size:14px}
.lessons a:first-of-type{border-top:none}
.lessons a span{color:var(--dim);font-size:12px}

/* ── 練習中 ── */
.runtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  font-size:12.5px;color:var(--dim);font-weight:700;letter-spacing:.04em}
.prog{height:7px;background:var(--t0);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--btn);border-radius:99px;transition:width .3s}
.lw{font-size:40px;font-weight:800;color:var(--ink);text-align:center;line-height:1.6;margin:6px 0 2px}
.lw rt{font-size:.42em}
.lg{text-align:center;font-size:19px;font-weight:700;color:var(--rose-d);margin-bottom:12px}
.lx{font-size:17px;line-height:2.3;background:var(--bg-soft);border-radius:14px;padding:10px 12px;
  border:1px solid var(--line)}
.lxz{color:var(--dim);font-size:13px;margin:6px 2px 14px}
.qhead{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:12px}
.qtype{color:var(--rose);font-weight:800;letter-spacing:.08em}
.qstem{margin-bottom:14px;text-align:center}
.qw{font-size:34px;font-weight:800;color:var(--ink);line-height:1.7}
.qw.zh{font-size:26px}
.qx{font-size:18px;line-height:2.4;text-align:left}
.qstem small{display:block;color:var(--dim);font-size:13px;margin-top:6px;line-height:1.7}
.blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid var(--rose);color:transparent;margin:0 2px}
.opt{display:block;width:100%;text-align:left;margin-bottom:9px;font-size:16.5px;padding:12px 15px;
  min-height:52px;border-radius:15px;background:var(--bg-soft)}
html[data-theme="cool"] .opt{border-radius:4px}
.opt.correct{background:#E9FBF4;border-color:#7DDBBE;color:var(--mint-d);font-weight:700}
.opt.wrong{background:#FFF0EE;border-color:#F7A99C;color:var(--bad)}
html[data-theme="cool"] .opt.correct{background:rgba(0,229,160,.14);border-color:#00E5A0}
html[data-theme="cool"] .opt.wrong{background:rgba(255,92,122,.13);border-color:#FF5C7A}
.feed{font-size:14px;line-height:2;min-height:24px;margin:4px 0 10px}
.feed.ok{color:var(--mint-d)} .feed.ng{color:var(--bad)}
.feed .due{display:block;color:var(--dim);font-size:12px}
.big-num{font-size:44px;font-weight:900;color:var(--rose-d);text-align:center;line-height:1.2}

/* ── 單元 / 進度 ── */
.unit .uh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.unit .uh b{font-size:15px;color:var(--ink)}
.unit .uh span{font-size:12px;color:var(--dim)}
.stack{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--t0);margin:9px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.unit .row{margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.grid div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;
  text-align:center;min-width:0}
html[data-theme="cool"] .grid div{border-radius:4px}
.grid b{display:block;font-size:21px;line-height:1.3;color:var(--ink)}
.grid span{font-size:11px;color:var(--dim)}
.chart svg{width:100%;height:auto;display:block}
.chart .bq{fill:var(--t0)} .chart .bo{fill:var(--rose)} .chart .lb{fill:var(--dim);font-size:8px;text-anchor:middle}
.chart .lb.td{fill:var(--rose-d);font-weight:800}
.hard{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;
  border-top:1px dashed var(--line);font-size:15px}
.hard:first-child{border-top:none}
.hard small{color:var(--dim);font-size:12px;display:block}

nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:5px;padding:6px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 22px rgba(190,120,140,.16);
  max-width:520px;margin:0 auto}
html[data-theme="cool"] nav{background:#0F141C;border-radius:6px}
nav button{flex:1;min-height:44px;border:none;background:transparent;color:var(--dim);font-weight:700;
  font-size:14px;border-radius:999px;transition:background .18s,box-shadow .18s}
nav button.on{background:var(--btn);color:#fff;box-shadow:0 3px 10px rgba(239,106,139,.3)}
html[data-theme="cool"] nav button{border-radius:4px}
html[data-theme="cool"] nav button.on{color:#04120C}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="crumb" href="../index.html">← 課程列表</a>
    <a class="crumb" href="../speak/index.html" style="margin-left:10px">🎧 聽說起步</a>
    <button id="theme" class="ghost" style="min-height:30px;padding:3px 10px;font-size:12px">🎨 酷炫版</button>
  </div>
  <h1>📅 每日練習</h1>
  <div class="meta">
    <span class="pill hot" id="pStreak">🔥 連續 0 天</span>
    <span class="pill" id="pExam">還沒設定考試日</span>
    <span class="pill" id="pDeck">核心詞 0 / 224</span>
  </div>
</header>

<main>
<!-- 今天：一顆按鈕就開始，不讓初學者自己決定要練什麼 -->
<section id="vHome" class="show">
  <div class="card">
    <div class="today">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="bgc" cx="50" cy="50" r="42"></circle>
        <circle class="fgc" id="ringFg" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle>
        <text x="50" y="55" id="ringTx">0%</text>
        <text x="50" y="70" class="rs">今天</text>
      </svg>
      <div class="tasks" id="tasks"></div>
    </div>
    <div class="go"><button class="big" id="go">開始今天的練習</button></div>
    <p class="dim" id="goSub" style="margin:8px 0 0;text-align:center"></p>
  </div>

  <div class="card tipcard" id="examTip" style="display:none"></div>

  <div class="card">
    <h3>設定</h3>
    <div class="row" style="margin-bottom:10px"><span class="dim" style="min-width:64px">每天新詞</span>
      <div class="chips" id="cPer">
        <button class="chip" data-v="3">3</button><button class="chip" data-v="5">5</button>
        <button class="chip" data-v="10">10</button><button class="chip" data-v="15">15</button>
      </div>
    </div>
    <div class="exam"><span class="dim" style="min-width:64px">考試日</span>
      <input type="date" id="examDate"><button id="examClr" class="ghost">清除</button></div>
    <p class="dim" style="margin:8px 0 0">考前一週會提醒你改用「單元」頁衝刺。新詞照課表順序出，學過的詞系統自動排複習日。</p>
  </div>

  <div class="card lessons">
    <h3>🎬 看影片學（影片裡的詞點一下就能收進來，會一起排進每日複習）</h3>
    <a href="../index.html">全部影片課 <span>→</span></a>
  </div>
</section>

<!-- 練習中：學新詞卡 → 混合測驗 → 結算 -->
<section id="vRun">
  <div class="runtop"><span id="rStage">—</span><button id="quit" class="ghost" style="min-height:30px;padding:3px 12px">結束</button></div>
  <div class="prog"><i id="rProg"></i></div>

  <div class="card" id="learn" style="display:none">
    <div class="lw" id="lWord"></div>
    <div class="row" style="justify-content:center;margin-bottom:6px">
      <button class="say needtts" id="lSay">🔊 聽發音</button>
      <button class="say needtts" id="lSayX">🔊 聽例句</button>
    </div>
    <div class="lg" id="lGloss"></div>
    <div class="lx" id="lEx"></div>
    <div class="lxz" id="lExZ"></div>
    <button class="big" id="lNext">記住了，下一個 →</button>
  </div>

  <div class="card" id="quiz" style="display:none">
    <div class="qhead"><span class="qtype" id="qType">—</span><span id="qProg"></span></div>
    <div class="qstem" id="qStem"></div>
    <div id="opts"></div>
    <div class="feed" id="qFeed"></div>
    <button class="big" id="qNext" style="display:none">下一題 →</button>
  </div>

  <div class="card" id="done" style="display:none"></div>
</section>

<!-- 單元：考前自己挑範圍 -->
<section id="vUnits">
  <h2 class="ph">單元<small>學新詞・考前挑範圍衝刺</small></h2>
  <div class="card">
    <div class="row"><span class="dim">每次考</span>
      <div class="chips" id="cNum">
        <button class="chip on" data-v="10">10 題</button><button class="chip" data-v="20">20 題</button>
        <button class="chip" data-v="0">整個單元</button>
      </div>
    </div>
    <div class="legend" style="margin-top:10px">
      <span><i style="background:var(--t3)"></i>掌握</span><span><i style="background:var(--t2)"></i>熟悉</span>
      <span><i style="background:var(--t1)"></i>學習中</span><span><i style="background:var(--t0)"></i>還沒學</span>
    </div>
  </div>
  <div id="ulist"></div>
</section>

<!-- 進度：看得見自己在進步 -->
<section id="vStats">
  <h2 class="ph">進度<small>只存在這台裝置</small></h2>
  <div class="grid" id="sGrid"></div>
  <div class="card chart"><h3>最近 14 天答題（粉色＝答對）</h3><div id="chart"></div></div>
  <div class="card"><h3>最常錯的詞</h3><div id="hardList"></div>
    <button class="big" id="hardGo" style="margin-top:12px;display:none">把這些再練一次</button></div>
  <div class="card"><h3>換裝置／備份</h3>
    <p class="dim" style="margin:0 0 10px">紀錄存在這台的瀏覽器。換 iPad／iPhone 前先備份，到新裝置按「還原」。</p>
    <div class="row">
      <button id="bak">備份 JSON</button>
      <button id="resBtn">還原 JSON</button>
      <input type="file" id="resFile" accept="application/json,.json" style="display:none">
    </div>
  </div>
</section>
</main>

<nav>
  <button id="tabH" class="on">今天</button>
  <button id="tabU">單元</button>
  <button id="tabS">進度</button>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const LANG = D.lang || 'ja';
const WB_KEY = 'lk.wb.v2.' + LANG, ST_KEY = 'lk.stv.v2.' + LANG, CFG_KEY = 'lk.study.v1.' + LANG;
const MEM = {};

/* 舊版單一抽屜 lk.wordbook.v1 → 依文字腳本分流（她可能直接從這頁進來，搬遷不能只寫在別頁） */
(function migrateV1(){
  try{
    const raw = localStorage.getItem('lk.wordbook.v1');
    if(!raw) return;
    const old = JSON.parse(raw) || {}, ja = {}, fr = {};
    for(const w of Object.keys(old)) (/[぀-ヿ㐀-䶿一-鿿]/.test(w) ? ja : fr)[w] = old[w];
    // 合併、不是「新 key 不存在才寫」：新 key 可能已有一兩個詞，用存在就跳過會丟資料
    function mergeInto(key, obj){
      if(!Object.keys(obj).length) return;
      var cur = null; try{ cur = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){}
      localStorage.setItem(key, JSON.stringify(Object.assign({}, obj, cur || {})));
    }
    mergeInto('lk.wb.v2.ja', ja);
    mergeInto('lk.wb.v2.fr', fr);
    localStorage.removeItem('lk.wordbook.v1');
  }catch(e){}
})();

/* ===== 以下由 make_deck.py 從 template.html 的 @@SHARE 區塊注入（排程規則只有一份） ===== */
/* ---------- 儲存（跨課共用；無痕/沙箱退回記憶體） ----------
   ⚠ 這一段由 make_deck.py 原樣複製到每日練習頁：排程規則只能有一份，改這裡就好 */
function readLS(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return MEM[k] || def; } }
function writeLS(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let WB = readLS(WB_KEY, {});
let ST = readLS(ST_KEY, {days:{}, streak:0, last:''});

// 一律用「本地日」字串，不要用 toISOString()：UTC+8/9 會把日期算成前一天
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
                       '-' + String(d.getDate()).padStart(2,'0');
const todayISO = () => isoLocal(new Date());
function addDays(iso, n){
  const [y,m,dd] = iso.split('-').map(Number);
  const d = new Date(y, m-1, dd); d.setDate(d.getDate() + n);
  return isoLocal(d);
}

/* ---------- 間隔重複（SM-2 簡化版） ---------- */
// x＝出現的句子（跨課複習時拿來出克漏字）；last＝最後一次作答日（算「今天練了幾個詞」）
function newRec(t){
  return {s:t.s, r:t.r||'', g:t.g||'', b:t.b||t.s, x:t.x||'', first:todayISO(),
          seen:0, ok:0, ng:0, ivl:0, ef:2.5, reps:0, lapses:0, due:todayISO(), last:''};
}
function grade(rec, correct){
  const today = todayISO();
  rec.seen++;
  if(correct){
    rec.ok++;
    rec.reps++;
    rec.ivl = rec.reps === 1 ? 1 : rec.reps === 2 ? 3 : Math.max(4, Math.round(rec.ivl * rec.ef));
    rec.ef = Math.min(2.8, rec.ef + 0.1);
  } else {
    rec.ng++; rec.lapses++; rec.reps = 0; rec.ivl = 1;
    rec.ef = Math.max(1.3, rec.ef - 0.2);
  }
  rec.due = addDays(today, rec.ivl);
  rec.last = today;
  WB[rec.s] = rec; writeLS(WB_KEY, WB);
  return rec;
}
const isMastered = r => r.ivl >= 21;
const isDue = r => (r.due || todayISO()) <= todayISO();
function bumpStats(correct){
  const t = todayISO();
  ST.days[t] = ST.days[t] || {q:0, ok:0};
  ST.days[t].q++; if(correct) ST.days[t].ok++;
  if(ST.last !== t){ ST.streak = (ST.last === addDays(t,-1)) ? (ST.streak||0)+1 : 1; ST.last = t; }
  writeLS(ST_KEY, ST);
}

/* 發音（瀏覽器內建日語語音，離線可用、不呼叫任何服務）
   沒有日語語音時 ttsOK=false → 聽力題不出、🔊 按鈕隱藏，不可變成無聲死題 */
let JA_VOICE = null, ttsOK = false;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    JA_VOICE = vs.find(v=>/^ja/i.test(v.lang)) || null;
    ttsOK = !!JA_VOICE;
    if(typeof onTTSReady === 'function') onTTSReady();
  }catch(e){ ttsOK = false; }
}
if(typeof speechSynthesis !== 'undefined' && LANG === 'ja'){
  pickVoice();
  try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){}
}
// iOS 規定：第一次發音必須在使用者點擊的同一個事件裡呼叫（不要包在 setTimeout 裡）
function say(text, slow){
  if(!ttsOK || !text) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.voice = JA_VOICE; u.rate = slow ? 0.7 : 0.9;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

// 四選項契約：湊不出四個互不重複的選項就回 null，由上層換題型（不可拿掉）
function q4(label, stem, correctText, wrongTexts, audio){
  const seen = new Set([correctText]);
  const opts = [{text:correctText, correct:true}];
  for(const t of wrongTexts){
    if(seen.has(t)) continue;
    seen.add(t);
    opts.push({text:t, correct:false});
    if(opts.length === 4) break;
  }
  if(opts.length < 4) return null;          // 干擾項不夠 → 交給上層換題型
  return {label, stem, options:shuffle(opts), audio};
}

/* ===== 共用區塊結束 ===== */

let CFG = Object.assign({per:5, newDays:{}, exam:''}, readLS(CFG_KEY, {}));
const saveCFG = () => writeLS(CFG_KEY, CFG);
const MAXQ = 30;          // 一輪最多題數：積太多到期詞時分批，不讓她一次面對 80 題
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasKanji = s => /[㐀-鿿々]/.test(s || '');
const ruby = (s, r) => r ? '<ruby>' + esc(s) + '<rt>' + esc(r) + '</rt></ruby>' : esc(s);
const rubyToks = toks => (toks || []).map(([s, r]) => s === '@@' ? '<span class="blank">＿＿</span>' : ruby(s, r)).join('');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function reveal(el){   // 只做位移、不碰 opacity：動畫被暫停時內容也一定看得見
  if(!el || RM || !el.animate) return;
  el.animate([{transform:'translateY(8px)'}, {transform:'none'}], {duration:260, easing:'cubic-bezier(.2,.8,.25,1)'});
}

/* ---------- 詞庫：核心詞 + 影片課收進來的詞（跨課複習） ---------- */
const DECK = [];
D.units.forEach((u, ui) => u.w.forEach(w => { w.u = ui; DECK.push(w); }));
const BYS = new Map(DECK.map(w => [w.s, w]));
function item(s){
  if(BYS.has(s)) return BYS.get(s);
  const r = WB[s];
  if(!r) return null;
  // 影片課的詞：沒有詞性與預切例句，克漏字就用收詞時存下的原句
  return {s:r.s, r:r.r || '', g:r.g || '', p:'', x:r.x || '', xz:'', xf:r.s, u:-1, ext:true};
}
function quizPool(){
  const p = DECK.slice();
  for(const s of Object.keys(WB)) if(!BYS.has(s)){ const it = item(s); if(it) p.push(it); }
  return p;
}
// 0 還沒學／1 學習中／2 熟悉（連對 2 次以上）／3 掌握（間隔 ≥21 天）
function tier(s){
  const r = WB[s];
  if(!r) return 0;
  if(isMastered(r)) return 3;
  return r.reps >= 2 ? 2 : 1;
}

/* ---------- 今天的任務 ---------- */
function plan(){
  const t = todayISO();
  const due = Object.values(WB).filter(r => isDue(r))
    .sort((a, b) => (a.due || '').localeCompare(b.due || '')).map(r => item(r.s)).filter(Boolean);
  const left = Math.max(0, (CFG.per || 5) - (CFG.newDays[t] || 0));
  const fresh = DECK.filter(w => !WB[w.s]).slice(0, left);
  const doneToday = Object.values(WB).filter(r => r.last === t).length;
  return {due, fresh, doneToday};
}
function examDays(){
  if(!CFG.exam) return null;
  const [y, m, d] = CFG.exam.split('-').map(Number);
  const [ty, tm, td] = todayISO().split('-').map(Number);
  return Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 86400000);
}
function renderHeader(){
  $('pStreak').textContent = '🔥 連續 ' + (ST.streak || 0) + ' 天';
  const n = examDays();
  $('pExam').textContent = n === null ? '還沒設定考試日' : n > 0 ? '距離考試 ' + n + ' 天' : n === 0 ? '今天考試，加油！' : '考試日已過';
  $('pExam').classList.toggle('hot', n !== null && n >= 0 && n <= 7);
  const learned = DECK.filter(w => WB[w.s]).length;
  $('pDeck').textContent = '核心詞 ' + learned + ' / ' + DECK.length;
}
function renderHome(){
  renderHeader();
  const p = plan();
  const remain = p.due.length + p.fresh.length;
  const total = remain + p.doneToday;
  const pct = total ? Math.round(p.doneToday / total * 100) : 100;
  $('ringFg').setAttribute('stroke-dashoffset', String(263.9 * (1 - pct / 100)));
  $('ringTx').textContent = pct + '%';
  const dueVid = p.due.filter(w => w.ext).length;
  $('tasks').innerHTML =
    '<div><b>' + p.due.length + '</b>個詞要複習' + (dueVid ? '<span class="dim">（含影片 ' + dueVid + '）</span>' : '') + '</div>' +
    '<div><b>' + p.fresh.length + '</b>個新詞</div>' +
    '<div class="dim">今天已練 ' + p.doneToday + ' 個詞</div>';
  const go = $('go');
  if(remain){
    const n = Math.min(MAXQ, remain);
    go.textContent = p.doneToday ? '繼續今天的練習' : '開始今天的練習';
    go.disabled = false;
    $('goSub').textContent = '約 ' + Math.max(2, Math.round(n * 0.25 + p.fresh.length * 0.3)) + ' 分鐘・' + n + ' 題' +
      (remain > MAXQ ? '（今天的分兩輪）' : '');
  } else {
    go.textContent = '今天的任務完成了 🎉';
    go.disabled = true;
    $('goSub').textContent = '想多練？到「單元」頁挑一個單元考一輪，或明天再來。';
  }
  // 考前一週：改成衝刺模式的提示
  const n = examDays(), tip = $('examTip');
  if(n !== null && n >= 0 && n <= 7){
    tip.style.display = 'block';
    tip.innerHTML = '<h3>⏰ 考前 ' + (n || '最後') + (n ? ' 天' : ' 一天') + '</h3>' +
      '<p class="dim" style="margin:0 0 10px">每天照常做完上面的複習，再到「單元」頁把要考的單元各考一輪；錯的詞到「進度」頁的「最常錯的詞」再練。</p>' +
      '<button id="tipGo">去單元頁衝刺 →</button>';
    $('tipGo').onclick = () => tab('U');
  } else tip.style.display = 'none';
  // 設定面板狀態
  Array.from(document.querySelectorAll('#cPer .chip')).forEach(c => c.classList.toggle('on', +c.dataset.v === (CFG.per || 5)));
  $('examDate').value = CFG.exam || '';
}

/* ---------- 一輪練習：學新詞卡 → 混合測驗 → 結算 ---------- */
let S = null, POOL = [];
function startSession(learnList, quizList, opts){
  POOL = quizPool();
  S = Object.assign({learn:learnList.slice(), li:0, queue:quizList.map(w => ({w, retry:false})),
                     qi:0, n:0, ok:0, wrong:[], practice:false, title:'今天的練習'}, opts || {});
  tab('H');
  if(S.learn.length) showLearn(); else nextQ();
}
function showOnly(id){ ['learn', 'quiz', 'done'].forEach(k => $(k).style.display = k === id ? 'block' : 'none'); }
function setProg(i, n, label){
  $('rStage').textContent = label;
  $('rProg').style.width = (n ? Math.min(100, i / n * 100) : 0) + '%';
}

function showLearn(){
  const w = S.learn[S.li];
  showOnly('learn');
  setProg(S.li, S.learn.length, '新詞 ' + (S.li + 1) + ' / ' + S.learn.length + '・先認識再測驗');
  $('lWord').innerHTML = ruby(w.s, w.r);
  $('lGloss').textContent = w.g;
  $('lEx').innerHTML = w.xt ? rubyToks(w.xt) : esc(w.x);
  $('lExZ').textContent = w.xz || '';
  $('lSay').onclick = () => say(w.r || w.s);
  $('lSayX').onclick = () => say(w.x, true);
  reveal($('learn'));
}
$('lNext').onclick = () => {
  const w = S.learn[S.li];
  if(!WB[w.s]){
    WB[w.s] = newRec({s:w.s, r:w.r, g:w.g, b:w.s, x:w.x});
    writeLS(WB_KEY, WB);
    const t = todayISO();
    CFG.newDays[t] = (CFG.newDays[t] || 0) + 1;
    saveCFG();
  }
  S.li++;
  if(S.li < S.learn.length) showLearn(); else nextQ();
};

// 剛學的詞先出「認得」的題（詞義／中翻日／聽力），答對過一次才出讀音與克漏字
function kindsFor(w){
  const r = WB[w.s], fresh = !r || !r.reps;
  const ks = [];
  if(w.g){ ks.push('mean', 'rev'); }
  if(ttsOK) ks.push('listen');
  if(!fresh || !ks.length){
    if(w.r && hasKanji(w.s)) ks.push('read');
    if(w.xc || (w.x && w.x.includes(w.xf || w.s))) ks.push('cloze');
  }
  return ks;
}
function buildQ(w, kind, P){
  const others = (P || []).filter(x => x.s !== w.s);
  // 干擾項優先挑同詞性（動詞配動詞），湊不滿再用其他詞
  const near = key => shuffle(others.filter(x => x[key] && x[key] !== w[key]))
    .sort((a, b) => ((w.p && a.p === w.p) ? 0 : 1) - ((w.p && b.p === w.p) ? 0 : 1));
  const fmtW = x => x.s + (x.r ? '（' + x.r + '）' : '');
  if(kind === 'read' && w.r && hasKanji(w.s))
    return q4('讀音', '<div class="qw">' + esc(w.s) + '</div><small>怎麼唸？</small>',
              w.r, near('r').map(x => x.r));
  if(kind === 'mean' && w.g)
    return q4('詞義', '<div class="qw">' + ruby(w.s, w.r) + '</div><small>是什麼意思？</small>',
              w.g, near('g').map(x => x.g));
  if(kind === 'rev' && w.g)
    return q4('中翻日', '<div class="qw zh">' + esc(w.g) + '</div><small>日文是哪一個？</small>',
              fmtW(w), near('s').filter(x => x.g !== w.g).map(fmtW));
  if(kind === 'listen' && ttsOK)
    return q4('聽力', '<button class="say" id="qSay" type="button">🔊 再聽一次</button><small>聽到的是哪個詞？</small>',
              fmtW(w), near('s').filter(x => (x.r || x.s) !== (w.r || w.s)).map(fmtW), {say:w.r || w.s});
  if(kind === 'cloze'){
    const form = x => x.xf || x.s;
    let stem = '';
    if(w.xc) stem = rubyToks(w.xc);
    else if(w.x && w.x.includes(form(w))) stem = esc(w.x).replace(esc(form(w)), '<span class="blank">＿＿</span>');
    else return null;
    return q4('克漏字', '<div class="qx">' + stem + '</div>' + (w.xz ? '<small>' + esc(w.xz) + '</small>' : '<small>選出最適合填入的詞</small>'),
              form(w), near('s').filter(x => form(x) !== form(w)).map(form));
  }
  return null;
}

function nextQ(){
  if(S.qi >= S.queue.length) return finish();
  const it = S.queue[S.qi], w = it.w;
  let q = null;
  for(const k of shuffle(kindsFor(w))){ q = buildQ(w, k, POOL); if(q) break; }
  if(!q) q = {label:'複習', stem:'<div class="qw">' + ruby(w.s, w.r) + '</div><small>' + esc(w.g) + '</small>',
              options:[{text:'記得 → 下一題', correct:true}]};
  S.cur = q; S.answered = false;
  showOnly('quiz');
  setProg(S.qi, S.queue.length, S.title + '・第 ' + (S.qi + 1) + ' / ' + S.queue.length + ' 題');
  $('qType').textContent = (it.retry ? '再一次・' : '') + q.label;
  $('qProg').textContent = S.ok + ' 對 / ' + S.n + ' 題';
  $('qStem').innerHTML = q.stem;
  $('qFeed').textContent = ''; $('qFeed').className = 'feed';
  $('qNext').style.display = 'none';
  const box = $('opts'); box.innerHTML = '';
  q.options.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o.text;
    b.onclick = () => answer(b, o.correct);
    box.appendChild(b);
  });
  // 同一個點擊事件裡直接發音（iOS 不准在計時器裡第一次發音）
  if(q.audio && q.audio.say){ say(q.audio.say); const qs = $('qSay'); if(qs) qs.onclick = () => say(q.audio.say); }
  reveal($('quiz'));
}

function answer(btn, correct){
  if(S.answered) return;
  S.answered = true;
  const it = S.queue[S.qi], w = it.w, t = todayISO();
  btn.classList.add(correct ? 'correct' : 'wrong');
  const right = S.cur.options.find(o => o.correct);
  document.querySelectorAll('#opts .opt').forEach(b => { if(b.textContent === right.text) b.classList.add('correct'); });
  // 一個詞一天只計分一次：同一天重考（衝刺、再練一次）不再推動排程，避免灌水
  let rec = WB[w.s], graded = false;
  if(!it.retry){
    S.n++; if(correct) S.ok++; else S.wrong.push(w);
    bumpStats(correct);
    if(!S.practice && (!rec || rec.last !== t)){
      rec = grade(rec || newRec({s:w.s, r:w.r, g:w.g, b:w.s, x:w.x}), correct);
      graded = true;
    }
  }
  // 答錯的詞排到這輪最後再出一次（不計分），當場把錯的記起來
  if(!correct && !it.retry) S.queue.push({w, retry:true});
  const f = $('qFeed');
  f.className = 'feed ' + (correct ? 'ok' : 'ng');
  f.innerHTML = (correct ? '✔ 答對了　' : '✘ 正確答案　') + ruby(w.s, w.r) + '　' + esc(w.g) +
    ' <button class="say needtts" id="fSay" type="button">🔊</button>' +
    (graded ? '<span class="due">下次複習：' + rec.due + (rec.ivl >= 21 ? '（已掌握）' : '') + '</span>'
            : it.retry ? '<span class="due">這題是再練一次，不計分</span>' : '');
  $('fSay').onclick = () => say(w.r || w.s);
  $('qProg').textContent = S.ok + ' 對 / ' + S.n + ' 題';
  $('qNext').style.display = 'block';
  S.qi++;
}
$('qNext').onclick = () => nextQ();

function finish(){
  showOnly('done');
  setProg(1, 1, S.title + '・完成');
  const pct = S.n ? Math.round(S.ok / S.n * 100) : 0;
  const p = plan();
  const wrong = S.wrong.filter((w, i, a) => a.findIndex(x => x.s === w.s) === i);
  $('done').innerHTML =
    '<div class="big-num">' + S.ok + ' / ' + S.n + '</div>' +
    '<p class="dim" style="text-align:center;margin:0 0 12px">正確率 ' + pct + '%・🔥 連續 ' + (ST.streak || 0) + ' 天' +
      (p.due.length + p.fresh.length ? '・今天還剩 ' + (p.due.length + p.fresh.length) + ' 個' : '・今天完成了 🎉') + '</p>' +
    (wrong.length ? '<h3>這輪錯的詞</h3>' + wrong.map(w =>
      '<div class="hard"><div>' + ruby(w.s, w.r) + '<small>' + esc(w.g) + '</small></div></div>').join('') : '<p style="text-align:center">全對！太強了 ✨</p>') +
    '<div class="row" style="margin-top:14px">' +
      (wrong.length ? '<button id="dWrong">錯的再練一次</button>' : '') +
      (p.due.length + p.fresh.length ? '<button id="dMore">繼續今天的</button>' : '') +
      '<button id="dHome">回首頁</button></div>';
  if($('dWrong')) $('dWrong').onclick = () => startSession([], shuffle(wrong), {practice:true, title:'錯題再練'});
  if($('dMore')) $('dMore').onclick = startToday;
  $('dHome').onclick = () => { S = null; tab('H'); };
  reveal($('done'));
}
$('quit').onclick = () => {
  if(S && S.qi < S.queue.length && S.n && !confirm('結束這一輪？已作答的紀錄都會保留。')) return;
  S = null; tab('H');
};

function startToday(){
  const p = plan();
  const due = p.due.filter(w => !p.fresh.some(f => f.s === w.s));
  const quiz = shuffle(p.fresh.concat(due.slice(0, Math.max(0, MAXQ - p.fresh.length))));
  if(!quiz.length){ renderHome(); return; }
  startSession(p.fresh, quiz, {title:'今天的練習'});
}
$('go').onclick = startToday;

/* ---------- 單元 ---------- */
let UNUM = 10;
function renderUnits(){
  const box = $('ulist'); box.innerHTML = '';
  D.units.forEach((u, ui) => {
    const c = [0, 0, 0, 0];
    u.w.forEach(w => c[tier(w.s)]++);
    const n = u.w.length, pc = k => (c[k] / n * 100).toFixed(1) + '%';
    const card = document.createElement('div');
    card.className = 'card unit';
    card.innerHTML =
      '<div class="uh"><b>' + (ui + 1) + '. ' + esc(u.n) + '</b><span>' + (n - c[0]) + ' / ' + n + ' 學過</span></div>' +
      '<div class="stack"><i style="width:' + pc(3) + ';background:var(--t3)"></i><i style="width:' + pc(2) +
        ';background:var(--t2)"></i><i style="width:' + pc(1) + ';background:var(--t1)"></i></div>' +
      '<div class="legend">掌握 ' + c[3] + '・熟悉 ' + c[2] + '・學習中 ' + c[1] + '・還沒學 ' + c[0] + '</div>' +
      '<div class="row"></div>';
    const row = card.querySelector('.row');
    if(c[0]){
      const b = document.createElement('button');
      b.textContent = '學新詞（' + Math.min(10, c[0]) + '）';
      b.onclick = () => { const L = u.w.filter(w => !WB[w.s]).slice(0, 10); startSession(L, shuffle(L), {title:u.n + '・新詞'}); };
      row.appendChild(b);
    }
    const q = document.createElement('button');
    q.textContent = '考這個單元';
    q.onclick = () => { let L = shuffle(u.w); if(UNUM) L = L.slice(0, UNUM); startSession([], L, {title:u.n + '・衝刺'}); };
    row.appendChild(q);
    box.appendChild(card);
  });
}
function bindChips(id, cb){
  $(id).addEventListener('click', ev => {
    const b = ev.target.closest ? ev.target.closest('.chip') : null;
    if(!b) return;
    Array.from($(id).querySelectorAll('.chip')).forEach(c => c.classList.toggle('on', c === b));
    cb(b.dataset.v);
  });
}
bindChips('cNum', v => { UNUM = parseInt(v, 10) || 0; });
bindChips('cPer', v => { CFG.per = parseInt(v, 10) || 5; saveCFG(); renderHome(); });
$('examDate').addEventListener('change', e => { CFG.exam = e.target.value || ''; saveCFG(); renderHome(); });
$('examClr').onclick = () => { CFG.exam = ''; saveCFG(); renderHome(); };

/* ---------- 進度 ---------- */
function renderStats(){
  const all = Object.values(WB), t = todayISO(), td = ST.days[t] || {q:0, ok:0};
  const c = [0, 0, 0, 0]; all.forEach(r => c[tier(r.s)]++);
  $('sGrid').innerHTML =
    '<div><b>' + all.length + '</b><span>學過的詞</span></div>' +
    '<div><b style="color:var(--rose-d)">' + all.filter(r => isDue(r)).length + '</b><span>今天待複習</span></div>' +
    '<div><b>' + (ST.streak || 0) + '</b><span>連續天數</span></div>' +
    '<div><b style="color:var(--mint-d)">' + c[2] + '</b><span>熟悉</span></div>' +
    '<div><b style="color:var(--rose)">' + c[3] + '</b><span>掌握</span></div>' +
    '<div><b>' + (td.q ? Math.round(td.ok / td.q * 100) + '%' : '—') + '</b><span>今日正確率</span></div>';
  // 14 天長條圖：淺色＝答題數，深色＝答對數
  const days = []; for(let i = 13; i >= 0; i--) days.push(addDays(t, -i));
  const mx = Math.max(10, ...days.map(d => (ST.days[d] || {}).q || 0));
  const W = 20, H = 90;
  let svg = '<svg viewBox="0 0 ' + (W * 14) + ' ' + (H + 16) + '" role="img" aria-label="最近 14 天答題數">';
  days.forEach((d, i) => {
    const v = ST.days[d] || {q:0, ok:0};
    const hq = v.q / mx * H, ho = v.ok / mx * H, x = i * W + 4;
    svg += '<rect class="bq" x="' + x + '" y="' + (H - hq) + '" width="12" height="' + hq + '" rx="3"><title>' + d + '：' + v.q + ' 題、對 ' + v.ok + '</title></rect>';
    svg += '<rect class="bo" x="' + x + '" y="' + (H - ho) + '" width="12" height="' + ho + '" rx="3"></rect>';
    svg += '<text class="lb' + (d === t ? ' td' : '') + '" x="' + (x + 6) + '" y="' + (H + 12) + '">' + (+d.slice(8)) + '</text>';
  });
  $('chart').innerHTML = svg + '</svg>';
  // 最常錯：先看忘記次數，再看答錯次數
  const hard = all.filter(r => r.ng > 0).sort((a, b) => (b.lapses - a.lapses) || (b.ng - a.ng)).slice(0, 8);
  $('hardList').innerHTML = hard.length ? hard.map(r =>
    '<div class="hard"><div>' + ruby(r.s, r.r) + '<small>' + esc(r.g) + '・錯 ' + r.ng + ' 次</small></div>' +
    '<button class="say needtts" data-say="' + esc(r.r || r.s) + '">🔊</button></div>').join('')
    : '<p class="dim" style="margin:0">還沒有答錯的詞 👍</p>';
  $('hardList').querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  $('hardGo').style.display = hard.length ? 'block' : 'none';
  $('hardGo').onclick = () => startSession([], shuffle(hard.map(r => item(r.s)).filter(Boolean)), {practice:true, title:'常錯詞特訓'});
}

/* 備份／還原（換裝置用）：還原時逐詞保留「練得比較多」的那一份，不會把新裝置的進度洗掉 */
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download = name; a.click();
}
$('bak').onclick = () => download('langkit_' + LANG + '_' + todayISO() + '.json',
  JSON.stringify({v:2, lang:LANG, wb:WB, st:ST, cfg:CFG}, null, 1));
$('resBtn').onclick = () => $('resFile').click();
$('resFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const o = JSON.parse(rd.result);
      if(o.lang && o.lang !== LANG){ alert('這是「' + o.lang + '」的備份，跟這頁的語言不同。'); return; }
      const wb = o.wb || {}, n = Object.keys(wb).length;
      if(!confirm('還原 ' + n + ' 個詞的紀錄？同一個詞會保留練習次數比較多的那份。')) return;
      for(const [s, r] of Object.entries(wb)) if(!WB[s] || (r.seen || 0) > (WB[s].seen || 0)) WB[s] = r;
      writeLS(WB_KEY, WB);
      if(o.st && o.st.days){
        for(const [d, v] of Object.entries(o.st.days)) if(!ST.days[d] || (v.q || 0) > ST.days[d].q) ST.days[d] = v;
        if((o.st.last || '') > (ST.last || '')){ ST.last = o.st.last; ST.streak = o.st.streak || ST.streak; }
        writeLS(ST_KEY, ST);
      }
      if(o.cfg){ CFG.per = o.cfg.per || CFG.per; CFG.exam = CFG.exam || o.cfg.exam || ''; saveCFG(); }
      alert('還原完成：' + n + ' 個詞');
      tab('S');
    }catch(err){ alert('讀不懂這個檔案：' + err.message); }
  };
  rd.readAsText(f);
  e.target.value = '';
});

/* ---------- 分頁 / 主題 ---------- */
function tab(name){
  const running = !!S;
  $('vHome').classList.toggle('show', name === 'H' && !running);
  $('vRun').classList.toggle('show', name === 'H' && running);
  $('vUnits').classList.toggle('show', name === 'U');
  $('vStats').classList.toggle('show', name === 'S');
  ['H', 'U', 'S'].forEach(k => $('tab' + k).classList.toggle('on', k === name));
  if(name === 'H' && !running) renderHome();
  if(name === 'U') renderUnits();
  if(name === 'S') renderStats();
  renderHeader();
  const sec = document.querySelector('section.show');
  reveal(sec);
}
$('tabH').onclick = () => tab('H');
$('tabU').onclick = () => tab('U');
$('tabS').onclick = () => tab('S');
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  try{ localStorage.setItem('lk.theme', t); }catch(e){}
  $('theme').textContent = t === 'cool' ? '🌸 柔和版' : '🎨 酷炫版';
}
$('theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'cool' ? 'soft' : 'cool');
applyTheme(document.documentElement.dataset.theme || 'soft');
// 日語語音載入後才知道能不能出聽力題、要不要顯示 🔊
function onTTSReady(){ document.body.classList.toggle('tts', ttsOK); }
onTTSReady();
tab('H');
</script>
