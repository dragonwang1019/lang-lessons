<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的語言課">
<meta name="theme-color" content="#FFF8F4">
<title>情境對話 — 日語情境</title>
<style>
:root{--bg:#FFF8F4;--card:#FFFFFF;--line:#F5E1E8;--fg:#432F37;--dim:#957D86;
  --rose:#EF6A8B;--rose-d:#D94F72;--lav:#9B6BD6;--mint:#43BE9B;--bad:#D9737A;--sky:#6AA6E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Maru Gothic ProN","Yuanti TC","PingFang TC",-apple-system,sans-serif;
  font-size:16px;line-height:1.75;padding:0 0 calc(28px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{padding:16px 16px 4px}
.crumb{display:inline-block;font-size:13px;color:var(--dim);text-decoration:none;margin-right:10px}
h1{font-size:19px;margin:6px 0 8px;font-weight:800}
h1 span{color:var(--rose-d)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.pill{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-weight:600}
.pill b{color:var(--fg)}
.wrap{padding:0 16px}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding:4px 0 10px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:13.5px;font-weight:700;cursor:pointer;min-height:38px}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.scene{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;
  box-shadow:0 4px 18px rgba(214,124,147,.10);margin-bottom:14px}
.snote{font-size:12.5px;color:var(--dim);margin:-2px 0 10px}
.bubble{max-width:88%;padding:11px 14px;border-radius:18px;margin:9px 0;font-size:17px;font-weight:700;
  line-height:1.6;position:relative}
.bubble .zh{display:block;font-size:12.5px;font-weight:500;color:var(--dim);margin-top:3px}
.bubble.p{background:#F4F8FF;border:1px solid #DCE8F8;border-bottom-left-radius:6px}
.bubble.a{background:rgba(67,190,155,.13);border:1px solid #BFE8DC;margin-left:auto;border-bottom-right-radius:6px}
.bubble ruby rt{font-size:.42em;color:var(--lav);font-weight:600}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{width:100%;text-align:left;padding:13px 15px;border-radius:16px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font-size:16px;font-weight:700;cursor:pointer;min-height:50px;font-family:inherit}
.opt small{display:block;font-size:12px;font-weight:500;color:var(--dim);margin-top:2px}
.opt.correct{background:rgba(67,190,155,.16);border-color:var(--mint)}
.opt.wrong{background:rgba(217,115,122,.12);border-color:var(--bad);opacity:.75}
.opt:active{transform:scale(.99)}
.act{padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);
  font-size:14.5px;font-weight:700;cursor:pointer;min-height:44px;font-family:inherit}
.act.primary{background:linear-gradient(135deg,#FF9DB4,#EF6A8B);color:#fff;border-color:transparent}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.feed{margin-top:10px;font-size:13.5px;font-weight:700;min-height:20px}
.feed.ok{color:#26755F}.feed.ng{color:#A24B52}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px}
.done{text-align:center;padding:22px 10px}
.done b{font-size:20px}
.bar{height:8px;border-radius:999px;background:#FBE7EE;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFB3C4,#EF6A8B);transition:width .3s}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<header>
  <a class="crumb" href="../index.html">← 課程列表</a>
  <a class="crumb" href="../speak/index.html">🎧 聽說起步</a>
  <a class="crumb" href="../study/index.html">📅 每日練習</a>
  <h1>情境對話 <span>· 日語情境</span></h1>
  <div class="hint" id="ttsNote" style="margin:0 0 6px"></div>
  <div class="pills">
    <span class="pill">🔥 連續 <b id="streak">0</b> 天</span>
    <span class="pill">🎭 完成情境 <b id="doneN">0</b></span>
    <span class="pill">⭐ <b id="xp">0</b> XP</span>
  </div>
</header>

<div class="wrap">
  <div class="chips" id="scenes"></div>
  <div class="scene" id="card">
    <div class="snote" id="note"></div>
    <div id="talk"></div>
    <div id="askWrap" class="hide">
      <div class="hint" id="askHint">選一句回話</div>
      <div class="opts" id="opts"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div id="doneWrap" class="hide done">
      <b>👏 這個情境講完了</b>
      <p class="hint" id="doneMsg"></p>
      <button class="act primary" id="again">再走一次</button>
    </div>
  </div>
  <p class="hint">玩法：對方說一句 → 你選一句回話 → 選對才會往下走。<br>
  三個選項都「文法正確」，只有一個「這個場合該這樣說」——所以要先聽懂對方問什麼。</p>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const SCENES = D.scenes || [];
const $ = id => document.getElementById(id);

/* 語音：瀏覽器內建日語（離線可用）；第一次發音必須在使用者點擊事件裡 */
let VOICE = null, ttsOK = false;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    VOICE = vs.find(v => /^ja/i.test(v.lang)) || null;
    ttsOK = !!VOICE;
  }catch(e){ ttsOK = false; }
}
if(typeof speechSynthesis !== 'undefined'){
  pickVoice();
  try{ speechSynthesis.addEventListener('voiceschanged', pickVoice); }catch(e){}
}
function say(text, slow){
  if(!text) return;
  if(!ttsOK){ noteTTS(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.voice = VOICE; u.rate = slow ? 0.7 : 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* 紀錄（獨立 key，不污染單字排程） */
const KEY = 'lk.dlg.v1.ja';
const isoLocal = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO = () => isoLocal(new Date());
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return isoLocal(dt); }
let S = {days:{}, streak:0, last:'', xp:0, scenes:{}};
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
function bump(correct){
  const t = todayISO();
  S.days[t] = S.days[t] || {q:0, ok:0};
  S.days[t].q++; if(correct){ S.days[t].ok++; S.xp = (S.xp||0) + 1; }
  if(S.last !== t){ S.streak = (S.last === addDays(t,-1)) ? (S.streak||0)+1 : 1; S.last = t; }
  save(); paint();
}
function paint(){
  $('streak').textContent = S.streak || 0;
  $('xp').textContent = S.xp || 0;
  $('doneN').textContent = Object.keys(S.scenes || {}).length;
}

/* 狀態 */
let si = 0, ti = 0, locked = false;
function feed(msg, ok){ const f = $('feed'); f.textContent = msg || ''; f.className = 'feed' + (msg ? (ok ? ' ok' : ' ng') : ''); }
function setFeed(msg, ok){ feed(msg, ok); }
let ttsNoted = false;
function noteTTS(){
  if(ttsNoted) return;
  ttsNoted = true;
  const el = $('ttsNote');
  if(el){ el.textContent = 'ℹ️ 這台還沒裝日語語音：設定 → 輔助使用 → 朗讀內容 → 聲音 → 日文（下載一個即可，之後離線也能用）'; el.style.color = '#8A5327'; }
}

function paintScenes(){
  const box = $('scenes'); box.innerHTML = '';
  SCENES.forEach((sc, i)=>{
    const b = document.createElement('button');
    b.className = 'chip' + (i === si ? ' on' : '');
    b.textContent = (S.scenes && S.scenes[sc.id] ? '✓ ' : '') + (i+1) + '. ' + sc.title;
    b.onclick = ()=>openScene(i);
    box.appendChild(b);
  });
}
function bubble(who, ja, zh, rt){
  const d = document.createElement('div');
  d.className = 'bubble ' + who;
  d.innerHTML = (rt || ja) + (zh ? '<span class="zh">' + zh + '</span>' : '');
  return d;
}
function openScene(i){
  si = i; ti = 0; locked = false;
  paintScenes();
  const sc = SCENES[si];
  $('note').textContent = sc.note || '';
  $('talk').innerHTML = '';
  $('doneWrap').classList.add('hide');
  $('askWrap').classList.remove('hide');
  feed('');
  nextTurn();
}
function nextTurn(){
  const sc = SCENES[si];
  if(ti >= sc.turns.length){ finish(sc); return; }
  const t = sc.turns[ti];
  $('talk').appendChild(bubble('p', t.p.ja, t.p.zh, t.p.rt));
  // 對方說完，換你（自動播一次）
  setTimeout(()=>say(t.p.ja, false), 220);
  const box = $('opts'); box.innerHTML = '';
  const opts = shuffle(t.opts.slice());
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = o.ja + (o.zh ? '<small>' + o.zh + '</small>' : '');
    b.onclick = ()=>choose(b, o);
    box.appendChild(b);
  });
  $('askHint').textContent = '選一句回話（對方剛說了什麼？）';
  feed('');
  $('talk').scrollIntoView({block:'end', behavior:'smooth'});
}
function choose(btn, o){
  if(locked) return;
  const t = SCENES[si].turns[ti];
  if(o.ok){
    locked = true;
    btn.classList.add('correct');
    Array.from(document.querySelectorAll('.opt')).forEach(b=>{ if(b !== btn) b.classList.add('wrong'); });
    $('talk').appendChild(bubble('a', o.ja, o.zh, o.rt));
    feed('✔ 就是這句', true);
    bump(true);
    say(o.ja, false);
    setTimeout(()=>{ ti++; locked = false; nextTurn(); }, 1500);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    feed('再聽一次對方的話，想想他問的是什麼', false);
    bump(false);
    say(t.p.ja, true);
  }
}
function finish(sc){
  $('askWrap').classList.add('hide');
  $('doneWrap').classList.remove('hide');
  if(!(S.scenes && S.scenes[sc.id])){
    S.scenes = S.scenes || {}; S.scenes[sc.id] = todayISO(); save(); paint(); paintScenes();
  }
  $('doneMsg').textContent = '這個情境的 ' + sc.turns.length + ' 句你都會了。換一個情境，或再走一次練速度。';
}
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

$('again').onclick = ()=>openScene(si);
paint(); paintScenes();
if(SCENES.length) openScene(0);
else { $('note').textContent = '沒有情境資料，先跑 python3 make_dialog.py'; }
</script>
